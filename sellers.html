Module: Sellers Report (Standalone)
Current Version: v1.000
Date: August 2026
================================================================================

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sellers Report - SolarCheck Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #cbd5e1; }
        
        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            #report-container { box-shadow: none !important; border-top: none !important; padding: 1.5rem !important; }
        }
    </style>
</head>
<body class="antialiased py-10 print:py-0 min-h-screen">

    <div id="report-container" class="max-w-4xl mx-auto border-t-[16px] border-slate-900 shadow-2xl bg-white flex flex-col relative print:shadow-none print:border-t-0 p-12">
        <!-- Rendered content goes here -->
    </div>

    <script>
        // GLOBAL HELPERS
        window.cur = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v || 0);
        window.num = (v) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 }).format(v || 0);

        const COMPANIES = {
            rsr: { name: "ROCKLIN SOLAR REPAIR", license: "CA Lic # 1050566", phone: "916-741-0194", email: "erin@rocklinsolarrepair.com", logo: "thumbnail_RSR LOGO.png", website: "www.rocklinsolarrepair.com" },
            shine: { name: "SHINE ON SOLAR & MAINTENANCE", license: "CA Lic # 968940", phone: "707-596-9026", email: "iain@shineonsolar.us", logo: "Shine on Logo.png", website: "shineonsolar.us" },
            ssoc: { name: "SOLAR SERVICE OF COLORADO", license: "", phone: "303-747-5065", email: "matt.essig@solarserviceofco.com", logo: "ssoc_logo.png", website: "solarserviceofcolorado.com" }
        };

        const renderReport = () => {
            const params = new URLSearchParams(window.location.search);
            const encodedData = params.get('data');
            
            if (!encodedData) {
                document.getElementById('report-container').innerHTML = `<h2 class="text-2xl text-red-600 font-bold">Error: No data payload found. Please generate the report from SolarCheck Pro.</h2>`;
                return;
            }

            try {
                const payload = JSON.parse(decodeURIComponent(encodedData));
                const state = payload.state;
                const r = payload.r;
                
                const co = COMPANIES[state.company] || COMPANIES.rsr;
                const isTPO = ['lease', 'ppa', 'prepaid_lease', 'prepaid_ppa'].includes(state.o);
                const isPrepaid = state.o && state.o.includes('prepaid');
                const remAssetYears = isTPO ? Math.max(0, state.te - r.age).toFixed(1) : Math.max(0, state.l - r.age).toFixed(1);
                
                const ownershipMap = {
                    owned: "Homeowner Owned",
                    lease: "Fixed Payment (Lease / Predictable PPA)",
                    ppa: "Variable Payment (True Pay-per-kWh PPA)",
                    prepaid_lease: "Prepaid Agreement",
                    prepaid_ppa: "Prepaid Agreement"
                };
                
                const mainOwnershipText = isTPO ? "Third Party Owned" : "Homeowner Owned";
                const subOwnershipText = isTPO ? (ownershipMap[state.o] || "") : "";

                const isNegativeCashFlow = r.actSavNet < 0;
                const isNegativeTerm = r.futSavNet < 0;

                const maxRate = Math.max(r.blendedUtility, r.rYC_sol) || 1;
                const utilPercent = (r.blendedUtility / maxRate) * 100;
                const solPercent = (r.rYC_sol / maxRate) * 100;

                const content = `
                 <!-- Header -->
                 <div class="flex justify-between items-start border-b-4 border-slate-900 pb-6 mb-8 mt-2">
                    <div>
                       <h1 class="text-4xl font-black text-slate-900 uppercase tracking-tighter italic">Solar Financial Analysis</h1>
                       <p class="text-xl font-bold text-blue-600 mt-2 uppercase">${state.a || 'Subject Property Address'}</p>
                       <p class="text-sm font-semibold text-slate-600 mt-1 uppercase">${mainOwnershipText}${subOwnershipText ? ' (' + subOwnershipText + ')' : ''}${isTPO && state.tpoName ? ' | Provider: ' + state.tpoName : ''}</p>
                    </div>
                    <div class="text-right">
                       <div class="font-black uppercase tracking-widest text-sm text-slate-500 mt-2">
                          Verified Results
                       </div>
                    </div>
                 </div>

                 <!-- Top Metrics Row -->
                 <div class="grid grid-cols-3 gap-6 mb-10">
                    <div class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 text-center shadow-inner">
                       <i class="fas fa-solar-panel text-2xl text-blue-400 mb-3"></i>
                       <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">System Size</p>
                       <p class="text-3xl font-black text-blue-800 tracking-tighter">${state.sz.toFixed(2)} <span class="text-sm">kW</span></p>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 text-center shadow-inner">
                       <i class="fas fa-bolt text-2xl text-amber-400 mb-3"></i>
                       <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Lifetime Production to Date</p>
                       <p class="text-3xl font-black text-blue-800 tracking-tighter">${window.num(r.act)} <span class="text-sm">MWh</span></p>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 text-center shadow-inner">
                       <i class="fas fa-calendar-check text-2xl text-emerald-400 mb-3"></i>
                       <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Contract Remaining Years</p>
                       <p class="text-3xl font-black text-blue-800 tracking-tighter">${remAssetYears} <span class="text-sm">Yrs</span></p>
                    </div>
                 </div>

                 <!-- Monthly Cash Flow Block -->
                 <div class="mb-10 border-4 border-slate-900 rounded-[32px] overflow-hidden shadow-xl">
                     <div class="bg-slate-900 text-white px-8 py-4">
                         <h2 class="text-lg font-black uppercase tracking-widest flex items-center gap-3"><i class="fas fa-money-bill-trend-up text-emerald-400"></i> ${isNegativeCashFlow ? 'Monthly Cash Flow Shortfall' : 'Monthly Cash Flow Positive'}</h2>
                     </div>
                     <div class="p-8 bg-slate-50 grid grid-cols-2 gap-8 items-center">
                         <div class="space-y-6 border-r-2 border-slate-200 pr-8">
                             <div class="flex justify-between items-center"><span class="text-lg font-bold text-slate-600 uppercase">Avoided Monthly Utility Cost</span><span class="text-2xl font-black text-slate-800">${window.cur(r.actSav / 12)}</span></div>
                             <div class="flex justify-between items-center border-b-2 border-slate-200 pb-6"><span class="text-lg font-bold text-slate-600 uppercase">${isTPO ? 'Monthly Solar Payment' : 'Monthly Solar Cost'}</span><span class="text-2xl font-black text-red-600">- ${window.cur(r.pYC)}</span></div>
                         </div>
                         <div class="text-center">
                             <p class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">${isNegativeCashFlow ? 'MONTHLY NET OUT-OF-POCKET' : 'MONTHLY NET PROFIT'}</p>
                             <p class="text-6xl font-black ${isNegativeCashFlow ? 'text-red-600' : 'text-emerald-600'} italic tracking-tighter leading-none">${window.cur(Math.abs(r.actSavNet / 12))}</p>
                             <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-3">In ${isNegativeCashFlow ? 'extra cost' : 'savings'} per month</p>
                         </div>
                     </div>
                 </div>

                 <!-- Long Term Advantage & Hedge -->
                 <div class="grid grid-cols-2 gap-10 mb-10">
                    <!-- Cumulative Narrative -->
                    <div class="bg-slate-900 text-white p-8 rounded-[32px] shadow-xl flex flex-col justify-center relative overflow-hidden">
                        <div class="relative z-10">
                            <p class="text-xl sm:text-2xl font-black text-blue-400 uppercase tracking-[0.1em] mb-4">${isNegativeTerm ? 'CUMULATIVE FINANCIAL COST' : 'Future Solar Savings'}</p>
                            <p class="text-7xl font-black italic tracking-tighter ${isNegativeTerm ? 'text-red-400' : 'text-emerald-400'} mb-4 drop-shadow-lg">${window.cur(Math.abs(r.futSavNet))}</p>
                            <p class="text-sm text-slate-300 font-medium leading-relaxed italic">Projected net ${isNegativeTerm ? 'cost' : 'savings'} over the remaining ${remAssetYears} year term. ${isNegativeTerm ? 'This system is currently acting as a utility hedge, with total future costs projected to exceed avoided grid bills.' : 'This system is a "cash-flow positive" asset effectively shielding the owner from rising utility costs.'}</p>
                        </div>
                        <div class="absolute right-[-10%] bottom-[-10%] text-9xl text-white/5 rotate-12"><i class="fas fa-chart-line"></i></div>
                    </div>

                    <!-- The Inflation Hedge Tables -->
                    <div class="space-y-6">
                        <div class="bg-white border-2 border-slate-200 rounded-2xl p-5 shadow-sm">
                            <h3 class="text-[10px] font-black text-slate-800 uppercase tracking-widest mb-4 border-b pb-2">Energy Cost Comparison</h3>
                            <div class="mb-4">
                                <div class="flex justify-between items-end mb-1">
                                    <span class="text-xs font-bold text-slate-600 uppercase">Current Utility Rate</span>
                                    <span class="text-lg font-black text-slate-800">$${r.blendedUtility.toFixed(3)} <span class="text-[9px] text-slate-400 uppercase font-bold">/ kWh</span></span>
                                </div>
                                <div class="w-full bg-slate-200 rounded-full h-2.5 shadow-inner overflow-hidden">
                                    <div class="bg-slate-800 h-full rounded-full transition-all" style="width: ${utilPercent}%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between items-end mb-1">
                                    <span class="text-xs font-bold text-slate-600 uppercase">Solar Rate</span>
                                    <span class="text-lg font-black text-blue-600">$${r.rYC_sol.toFixed(3)} <span class="text-[9px] text-slate-400 uppercase font-bold">/ kWh</span></span>
                                </div>
                                <div class="w-full bg-blue-100 rounded-full h-2.5 shadow-inner overflow-hidden">
                                    <div class="bg-blue-600 h-full rounded-full transition-all" style="width: ${solPercent}%"></div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-blue-50 border-2 border-blue-100 rounded-2xl p-5 shadow-sm">
                            <h3 class="text-[10px] font-black text-blue-900 uppercase tracking-widest mb-4 border-b border-blue-200 pb-2">Inflation Protection</h3>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs font-bold text-blue-700 uppercase">Utility Inflation (Avg)</span>
                                <span class="text-base font-black text-blue-900">${state.e}%</span>
                            </div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-xs font-bold text-blue-700 uppercase">Fixed Solar Escalator</span>
                                <span class="text-base font-black text-blue-900">${state.tEs}%</span>
                            </div>
                            <div class="bg-white rounded-xl p-3 border border-blue-100 flex justify-between items-center">
                                <span class="text-xs font-black text-slate-700 uppercase">Hedge Spread</span>
                                <span class="text-sm font-black text-emerald-600">+ ${(state.e - state.tEs).toFixed(1)}% Advantage</span>
                            </div>
                        </div>
                    </div>
                 </div>

                 <!-- General Disclaimer -->
                 <div style="font-size: 0.75rem; color: #666; margin-top: 30px; border-top: 1px solid #ccc; padding-top: 15px; text-align: justify; line-height: 1.4; margin-bottom: 20px;">
                   <strong>General Disclaimer &amp; Forward-Looking Statements</strong><br>
                   This financial analysis is an estimate based on current market conditions, utility rate structures, and historical system data. Projections of future utility costs, solar energy production, and net financial savings are inherently uncertain and subject to change due to weather, hardware degradation, and evolving utility tariffs. While this report is prepared by a licensed California solar contractor and inspector, it is provided strictly for informational and advisory purposes. It does not constitute financial, legal, or tax advice. Homeowners are encouraged to consult with independent financial or legal professionals regarding the execution or transfer of third-party service agreements.
                 </div>

                 <!-- Footer -->
                 <div class="mt-auto border-t-4 border-slate-900 pt-6 flex justify-between items-end">
                    <div>
                        <p class="text-sm font-bold text-slate-800 uppercase tracking-tight mb-2"><i class="fas fa-screwdriver-wrench text-blue-600 mr-2"></i> ${isTPO || isPrepaid ? 'Service & maintenance covered under agreement.' : 'Homeowner responsible for service & maintenance.'}</p>
                        <div class="mt-4">
                            <p class="text-lg font-black italic text-slate-900 tracking-tighter uppercase">${co.name}</p>
                            <p class="text-[10px] font-bold text-slate-500 tracking-widest uppercase">${co.license}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-slate-400 font-black uppercase tracking-[0.2em] italic mb-4">SolarCheck Pro v7.341</p>
                        <div class="no-print flex gap-3 justify-end">
                            <button onclick="window.print()" class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-xl transition-all hover:bg-blue-500 active:scale-95 border-b-4 border-blue-800"><i class="fas fa-print mr-2"></i> Print</button>
                            <button onclick="window.close()" class="bg-slate-100 text-slate-700 px-8 py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest transition-all hover:bg-slate-200 border-b-4 border-slate-300">Close Tab</button>
                        </div>
                    </div>
                 </div>
                `;

                document.getElementById('report-container').innerHTML = content;
                document.title = `${state.a || 'Sellers Report'} - SolarCheck Pro`;

            } catch (err) {
                console.error("Failed to parse Sellers Report data payload:", err);
                document.getElementById('report-container').innerHTML = `<h2 class="text-2xl text-red-600 font-bold">Error loading report data.</h2><p>${err.message}</p>`;
            }
        };

        // Initialize report on load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderReport);
        } else {
            renderReport();
        }
    </script>
</body>
</html>
