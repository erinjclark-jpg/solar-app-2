<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sellers Report - SolarCheck Pro v1.16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LZ-String Decompression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #cbd5e1; margin: 0; padding: 0; }
        
        /* 
           CRITICAL PRINT FIXES:
           1. Exact color adjust forces background graphics.
           2. 84% Zoom pulls the orphaned footer line onto page 1.
           3. Overriding the 1056px min-height to prevent forced page 2 rollovers.
           4. Slightly compressed margins to ensure a perfect fit.
        */
        @media print {
            @page { size: letter portrait; margin: 0.25in; }
            
            body, html { 
                background: white !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
                min-height: 0 !important;
                height: auto !important;
                zoom: 0.84 !important; 
            }
            
            .no-print { display: none !important; }
            
            #report-export-wrapper { 
                padding: 0 !important; 
                margin: 0 !important;
                display: block !important; 
            }
            
            #report-container { 
                border-top: 12px solid #0f172a !important; 
                box-shadow: none !important; 
                padding: 1.5rem !important; 
                min-height: 0 !important; /* Kills the Tailwind min-h-[1056px] */
                height: auto !important;
                display: block !important; 
                max-width: 100% !important;
                width: 100% !important;
            }
            
            .report-card, .grid { 
                page-break-inside: avoid; 
                break-inside: avoid; 
            }

            /* Gentle margin compression to stop the footer rollover */
            .mb-10 { margin-bottom: 1.5rem !important; }
            .gap-10 { gap: 1.5rem !important; }
            .mt-8 { margin-top: 1rem !important; }
            .mb-8 { margin-bottom: 1rem !important; }
        }
    </style>
</head>
<body class="antialiased min-h-screen">

    <!-- FLOATING STANDARDIZED ACTION BAR (Hidden on Print) -->
    <div id="action-bar" class="no-print fixed top-5 right-5 z-50 flex items-center gap-3 bg-slate-900/90 backdrop-blur-md p-2 rounded-full shadow-2xl border border-slate-700">
        <button type="button" onclick="window.history.back()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-full font-bold text-xs uppercase tracking-wider transition-all flex items-center gap-2 shadow-md">
            <i class="fas fa-arrow-left"></i> Return
        </button>
        <button type="button" onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-full font-bold text-xs uppercase tracking-wider transition-all flex items-center gap-2 shadow-md">
            <i class="fas fa-print"></i> Print / Save PDF
        </button>
    </div>

    <!-- WRAPPER -->
    <div id="report-export-wrapper" class="py-10">
        <div id="report-container" class="max-w-4xl mx-auto border-t-[16px] border-slate-900 shadow-2xl bg-white flex flex-col relative p-12 min-h-[1056px]">
            <!-- Rendered content goes here -->
            <div class="flex items-center justify-center h-full text-slate-400">
                <i class="fas fa-circle-notch fa-spin text-4xl"></i>
            </div>
        </div>
    </div>

    <script>
        // GLOBAL HELPERS
        window.cur = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v || 0);
        window.num = (v) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 }).format(v || 0);

        const COMPANIES = {
            rsr: { name: "ROCKLIN SOLAR REPAIR", license: "CA Lic # 1050566", phone: "916-741-0194", email: "erin@rocklinsolarrepair.com", logo: "thumbnail_RSR LOGO.png", website: "www.rocklinsolarrepair.com" },
            shine: { name: "SHINE ON SOLAR & MAINTENANCE", license: "CA Lic # 968940", phone: "707-596-9026", email: "iain@shineonsolar.us", logo: "Shine on Logo.png", website: "shineonsolar.us" },
            ssoc: { name: "SOLAR SERVICE OF COLORADO", license: "", phone: "303-747-5065", email: "matt.essig@solarserviceofco.com", logo: "ssoc_logo.png", website: "solarserviceofcolorado.com" }
        };

        const renderReport = () => {
            const params = new URLSearchParams(window.location.search);
            let encodedData = params.get('data');
            
            // DEMO FALLBACK FOR PREVIEW WINDOW
            if (!encodedData) {
                const mockPayload = {
                    state: { a: "789 Demo Drive, Rocklin CA", sz: 7.2, o: "lease", tpoName: "Sunrun", te: 25, company: "rsr", tEs: 2.9, e: 7.0, l: 25, batteryMode: "both" },
                    r: { age: 3.5, act: 38.4, usableB: 10.8, blendedUtility: 0.35, rYC_sol: 0.38, actSav: 2520, pYC: 225.00, actSavNet: -180, futSavNet: 14500, estDay: 28.5 }
                };
                // Fallback decode for local testing
                if (window.LZString) {
                    encodedData = window.LZString.compressToEncodedURIComponent(JSON.stringify(mockPayload));
                } else {
                    encodedData = encodeURIComponent(JSON.stringify(mockPayload));
                }
            }

            try {
                let payload;
                // Auto-detect if data is LZString compressed or standard URI encoded
                try {
                    const decompressed = window.LZString ? window.LZString.decompressFromEncodedURIComponent(encodedData) : null;
                    payload = decompressed ? JSON.parse(decompressed) : JSON.parse(decodeURIComponent(encodedData));
                } catch(e) {
                    payload = JSON.parse(decodeURIComponent(encodedData));
                }

                const state = payload.state;
                const r = payload.r;
                
                const co = COMPANIES[state.company] || COMPANIES.rsr;
                const isTPO = ['lease', 'ppa', 'prepaid_lease', 'prepaid_ppa', 'loan'].includes(state.o);
                const isPrepaid = state.o && state.o.includes('prepaid');
                const remAssetYears = isTPO ? Math.max(0, state.te - r.age).toFixed(1) : Math.max(0, state.l - r.age).toFixed(1);
                
                const ownershipMap = {
                    owned: "Homeowner Owned",
                    lease: "Fixed Payment (Lease / Predictable PPA)",
                    ppa: "Variable Payment (True Pay-per-kWh PPA)",
                    prepaid_lease: "Prepaid Agreement",
                    prepaid_ppa: "Prepaid Agreement",
                    loan: "Transferable Loan"
                };
                
                const mainOwnershipText = isTPO && state.o !== 'loan' ? "Third Party Owned" : (state.o === 'loan' ? "Homeowner Owned (Financed)" : "Homeowner Owned");
                const subOwnershipText = isTPO ? (ownershipMap[state.o] || "") : "";

                // Scenario Logic Variables
                const isMonthlyPositive = r.actSavNet >= 0;
                const isTermPositive = r.futSavNet >= 0;
                const isCrossover = !isMonthlyPositive && isTermPositive;
                const isSunkAsset = !isMonthlyPositive && !isTermPositive;
                
                // Battery Logic
                const hasBattery = parseFloat(r.usableB) > 0;
                const batteryMode = payload.state.batteryMode || 'both';
                const isBackup = batteryMode === 'backup' || batteryMode === 'both';
                const isArbitrage = batteryMode === 'arbitrage';

                const maxRate = Math.max(r.blendedUtility, r.rYC_sol) || 1;
                const utilPercent = (r.blendedUtility / maxRate) * 100;
                const solPercent = (r.rYC_sol / maxRate) * 100;

                // Dynamic Cash Flow Block HTML
                let cashFlowBlockHtml = '';
                if (isMonthlyPositive) {
                    cashFlowBlockHtml = `
                    <div class="mb-10 border-4 border-slate-900 rounded-[32px] overflow-hidden shadow-xl">
                        <div class="bg-slate-900 text-white px-8 py-4">
                            <h2 class="text-lg font-black uppercase tracking-widest flex items-center gap-3"><i class="fas fa-money-bill-trend-up text-emerald-400"></i> Monthly Cash Flow Positive</h2>
                        </div>
                        <div class="p-8 bg-slate-50 grid grid-cols-2 gap-8 items-center">
                            <div class="space-y-6 border-r-2 border-slate-200 pr-8">
                                <div class="flex justify-between items-center"><span class="text-lg font-bold text-slate-600 uppercase">Avoided Monthly Utility Cost</span><span class="text-2xl font-black text-slate-800">${window.cur(r.actSav / 12)}</span></div>
                                <div class="flex justify-between items-center border-b-2 border-slate-200 pb-6"><span class="text-lg font-bold text-slate-600 uppercase">${isTPO ? 'Monthly Solar Payment' : 'Monthly Solar Cost'}</span><span class="text-2xl font-black text-red-600">- ${window.cur(r.pYC)}</span></div>
                            </div>
                            <div class="text-center">
                                <p class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">MONTHLY NET PROFIT</p>
                                <p class="text-6xl font-black text-emerald-600 italic tracking-tighter leading-none">${window.cur(Math.abs(r.actSavNet / 12))}</p>
                                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-3">In net savings per month</p>
                            </div>
                        </div>
                    </div>`;
                } else {
                    // Suppress net loss math and pivot to Gross comparison and Inflation limit
                    cashFlowBlockHtml = `
                    <div class="mb-10 border-4 border-slate-900 rounded-[32px] overflow-hidden shadow-xl">
                        <div class="bg-slate-900 text-white px-8 py-4">
                            <h2 class="text-lg font-black uppercase tracking-widest flex items-center gap-3"><i class="fas fa-shield-alt text-blue-400"></i> Monthly Energy Profile & Inflation Hedge</h2>
                        </div>
                        <div class="p-8 bg-slate-50 grid grid-cols-2 gap-8 items-center">
                            <div class="space-y-6 border-r-2 border-slate-200 pr-8">
                                <div class="flex justify-between items-center"><span class="text-lg font-bold text-slate-600 uppercase">Gross Avoided Utility Cost</span><span class="text-2xl font-black text-emerald-600">${window.cur(r.actSav / 12)}</span></div>
                                <div class="flex justify-between items-center border-b-2 border-slate-200 pb-6"><span class="text-lg font-bold text-slate-600 uppercase">${isTPO ? 'Fixed Solar Payment' : 'Fixed Solar Cost'}</span><span class="text-2xl font-black text-slate-800">${window.cur(r.pYC)}</span></div>
                            </div>
                            <div class="text-center">
                                <p class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Inflation Protection Limit</p>
                                <p class="text-6xl font-black text-blue-600 italic tracking-tighter leading-none">${state.tEs}%</p>
                                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-3">Solar payment capped annually vs volatile grid inflation</p>
                            </div>
                        </div>
                    </div>`;
                }
                
                // Narrative & Battery (Left Column)
                let leftColumnHtml = `<div class="flex flex-col h-full gap-6">`;
                
                if (isSunkAsset && isTPO && !isPrepaid) {
                    leftColumnHtml += `
                    <div class="bg-slate-900 text-white p-8 rounded-[32px] shadow-xl relative overflow-hidden flex-grow flex flex-col justify-center">
                        <div class="relative z-10">
                            <p class="text-xl font-black text-blue-400 uppercase tracking-[0.1em] mb-3"><i class="fas fa-shield-halved mr-2"></i> Transferable Peace of Mind</p>
                            <p class="text-3xl font-black italic tracking-tighter text-white mb-3">Zero Out-Of-Pocket Maintenance</p>
                            <p class="text-sm text-slate-300 font-medium leading-relaxed italic">Unlike homeowner-owned systems that carry heavy out-of-pocket liabilities for aging hardware, this service agreement functions as a bumper-to-bumper warranty. The provider is legally responsible for monitoring, ongoing maintenance, and total hardware replacement (including expensive inverters) at zero cost to the homeowner.</p>
                        </div>
                        <div class="absolute right-[-5%] bottom-[-10%] text-9xl text-white/5 rotate-12"><i class="fas fa-file-contract"></i></div>
                    </div>`;
                } else {
                    leftColumnHtml += `
                    <div class="bg-slate-900 text-white p-8 rounded-[32px] shadow-xl flex flex-col justify-center relative overflow-hidden flex-grow">
                        <div class="relative z-10">
                            <p class="text-xl sm:text-2xl font-black text-blue-400 uppercase tracking-[0.1em] mb-4">${isCrossover ? 'Long-Term Financial Advantage' : 'Future Solar Savings'}</p>
                            <p class="text-7xl font-black italic tracking-tighter text-emerald-400 mb-4 drop-shadow-lg">${window.cur(Math.abs(r.futSavNet))}</p>
                            <p class="text-sm text-slate-300 font-medium leading-relaxed italic">${isCrossover ? `While the initial rate acts as a slight premium today, the fixed contract protects you against compounding grid inflation, resulting in massive long-term profitability over the remaining ${remAssetYears} year term.` : `Projected net savings over the remaining ${remAssetYears} year term. This system is a "cash-flow positive" asset effectively shielding the owner from rising utility costs.`}</p>
                        </div>
                        <div class="absolute right-[-10%] bottom-[-10%] text-9xl text-white/5 rotate-12"><i class="fas fa-chart-line"></i></div>
                    </div>`;
                }

                // Add the Premium Battery Components
                if (hasBattery) {
                    if (isBackup) {
                        leftColumnHtml += `
                        <div class="bg-slate-900 border-2 border-amber-500/50 p-6 rounded-[32px] shadow-xl relative overflow-hidden shrink-0 group">
                            <div class="absolute inset-0 bg-amber-500/10 opacity-50 group-hover:opacity-100 transition-opacity"></div>
                            <div class="relative z-10">
                                <p class="text-lg font-black text-amber-400 uppercase tracking-[0.1em] mb-2 flex items-center gap-2"><i class="fas fa-bolt-lightning text-amber-300"></i> Grid Outage Protection: Active</p>
                                <p class="text-sm text-slate-300 font-medium leading-relaxed italic">This home is equipped with a high-capacity energy storage system. During rolling blackouts, severe weather, or grid failures, this home powers itself.</p>
                            </div>
                            <div class="absolute right-[-2%] top-1/2 -translate-y-1/2 text-7xl text-amber-500/10"><i class="fas fa-house-medical"></i></div>
                        </div>`;
                    } else if (isArbitrage) {
                        leftColumnHtml += `
                        <div class="bg-slate-900 border-2 border-emerald-500/50 p-6 rounded-[32px] shadow-xl relative overflow-hidden shrink-0 group">
                            <div class="absolute inset-0 bg-emerald-500/10 opacity-50 group-hover:opacity-100 transition-opacity"></div>
                            <div class="relative z-10">
                                <p class="text-lg font-black text-emerald-400 uppercase tracking-[0.1em] mb-2 flex items-center gap-2"><i class="fas fa-network-wired text-emerald-300"></i> Smart Grid Optimization</p>
                                <p class="text-sm text-slate-300 font-medium leading-relaxed italic">This property utilizes advanced energy storage to automatically harvest cheap morning solar and discharge it during expensive evening peak hours. This autonomous system shields the home from the most aggressive utility pricing tiers.</p>
                            </div>
                        </div>`;
                    }
                }
                
                leftColumnHtml += `</div>`;

                // Term Advantage / Hedge Block Integration
                const termAdvantageHtml = `
                <div class="grid grid-cols-2 gap-10 mb-8">
                    ${leftColumnHtml}
                    <div class="space-y-6 flex flex-col justify-center">
                        <div class="bg-white border-2 border-slate-200 rounded-2xl p-5 shadow-sm">
                            <h3 class="text-[10px] font-black text-slate-800 uppercase tracking-widest mb-4 border-b pb-2">Energy Cost Comparison</h3>
                            <div class="mb-4">
                                <div class="flex justify-between items-end mb-1">
                                    <span class="text-xs font-bold text-slate-600 uppercase">Current Utility Rate</span>
                                    <span class="text-lg font-black text-slate-800">$${r.blendedUtility.toFixed(3)} <span class="text-[9px] text-slate-400 uppercase font-bold">/ kWh</span></span>
                                </div>
                                <div class="w-full bg-slate-200 rounded-full h-2.5 shadow-inner overflow-hidden">
                                    <div class="bg-slate-800 h-full rounded-full transition-all print-bar" style="width: ${utilPercent}%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between items-end mb-1">
                                    <span class="text-xs font-bold text-slate-600 uppercase">Solar Rate</span>
                                    <span class="text-lg font-black text-blue-600">$${r.rYC_sol.toFixed(3)} <span class="text-[9px] text-slate-400 uppercase font-bold">/ kWh</span></span>
                                </div>
                                <div class="w-full bg-blue-100 rounded-full h-2.5 shadow-inner overflow-hidden">
                                    <div class="bg-blue-600 h-full rounded-full transition-all print-bar" style="width: ${solPercent}%"></div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-blue-50 border-2 border-blue-100 rounded-2xl p-5 shadow-sm">
                            <h3 class="text-[10px] font-black text-blue-900 uppercase tracking-widest mb-4 border-b border-blue-200 pb-2">Inflation Protection</h3>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs font-bold text-blue-700 uppercase">Utility Inflation (Avg)</span>
                                <span class="text-base font-black text-blue-900">${state.e}%</span>
                            </div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-xs font-bold text-blue-700 uppercase">Fixed Solar Escalator</span>
                                <span class="text-base font-black text-blue-900">${state.tEs}%</span>
                            </div>
                            <div class="bg-white rounded-xl p-3 border border-blue-100 flex justify-between items-center">
                                <span class="text-xs font-black text-slate-700 uppercase">Hedge Spread</span>
                                <span class="text-sm font-black text-emerald-600">+ ${(state.e - state.tEs).toFixed(1)}% Advantage</span>
                            </div>
                        </div>
                    </div>
                </div>
                `;

                // Top Metrics Ownership Card
                let card3Icon = "fas fa-calendar-check";
                let card3IconColor = "text-emerald-400";
                let card3Html = '';

                if (state.o === 'owned') {
                    card3Icon = "fas fa-home";
                    card3Html = `
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Monthly Solar Liability</p>
                        <p class="text-3xl font-black text-emerald-600 tracking-tighter">$0.00</p>
                        <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-2 border-t border-slate-200 pt-2 mx-4">Free & Clear</p>
                    `;
                } else if (isPrepaid) {
                    card3Icon = "fas fa-check-circle";
                    card3Html = `
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Monthly Solar Liability</p>
                        <p class="text-3xl font-black text-emerald-600 tracking-tighter">$0.00</p>
                        <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-2 border-t border-slate-200 pt-2 mx-4">Fully Prepaid</p>
                    `;
                } else if (state.o === 'loan') {
                    card3Icon = "fas fa-file-invoice-dollar";
                    card3IconColor = "text-blue-400";
                    card3Html = `
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Loan Remaining</p>
                        <p class="text-3xl font-black text-blue-800 tracking-tighter">${remAssetYears} <span class="text-sm">Yrs</span></p>
                        <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-2 border-t border-slate-200 pt-2 mx-4">Assumable Loan</p>
                    `;
                } else {
                    card3Icon = "fas fa-file-contract";
                    card3IconColor = "text-indigo-400";
                    card3Html = `
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Contract Remaining</p>
                        <p class="text-3xl font-black text-blue-800 tracking-tighter">${remAssetYears} <span class="text-sm">Yrs</span></p>
                        <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-2 border-t border-slate-200 pt-2 mx-4">Service Agreement</p>
                    `;
                }

                const content = `
                 <!-- Header -->
                 <div class="flex justify-between items-start border-b-4 border-slate-900 pb-6 mb-8 mt-2">
                    <div>
                       <h1 class="text-4xl font-black text-slate-900 uppercase tracking-tighter italic">Solar Financial Analysis</h1>
                       <p class="text-xl font-bold text-blue-600 mt-2 uppercase">${state.a || 'Subject Property Address'}</p>
                       <p class="text-sm font-semibold text-slate-600 mt-1 uppercase">${mainOwnershipText}${subOwnershipText ? ' (' + subOwnershipText + ')' : ''}${isTPO && state.tpoName ? ' | Provider: ' + state.tpoName : ''}</p>
                    </div>
                    <div class="text-right">
                       <div class="font-black uppercase tracking-widest text-sm text-slate-500 mt-2">
                          Verified Results
                       </div>
                    </div>
                 </div>

                 <!-- Top Metrics Row -->
                 <div class="grid grid-cols-3 gap-6 mb-8">
                    <div class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 text-center shadow-inner flex flex-col justify-center">
                       <i class="fas fa-solar-panel text-2xl text-blue-400 mb-3"></i>
                       <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">System Size</p>
                       <p class="text-3xl font-black text-blue-800 tracking-tighter">${state.sz.toFixed(2)} <span class="text-sm">kW</span></p>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 text-center shadow-inner flex flex-col justify-center">
                       <i class="fas fa-bolt text-2xl text-amber-400 mb-3"></i>
                       <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Daily Avg. Generation</p>
                       <p class="text-3xl font-black text-blue-800 tracking-tighter">${window.num(r.estDay)} <span class="text-sm">kWh</span></p>
                       <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-2 border-t border-slate-200 pt-2 mx-4">Avg US Home Uses ~29 kWh/Day</p>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 text-center shadow-inner flex flex-col justify-center">
                       <i class="${card3Icon} text-2xl ${card3IconColor} mb-3"></i>
                       ${card3Html}
                    </div>
                 </div>

                 <!-- Dynamic Cash Flow Block -->
                 ${cashFlowBlockHtml}

                 <!-- Long Term Advantage & Hedge -->
                 ${termAdvantageHtml}

                 <!-- General Disclaimer -->
                 <div class="mt-8" style="font-size: 0.75rem; color: #666; border-top: 1px solid #ccc; padding-top: 15px; text-align: justify; line-height: 1.4; margin-bottom: 15px;">
                   <strong>General Disclaimer &amp; Forward-Looking Statements</strong><br>
                   This financial analysis is an estimate based on current market conditions, utility rate structures, and historical system data. Projections of future utility costs, solar energy production, and net financial savings are inherently uncertain and subject to change due to weather, hardware degradation, and evolving utility tariffs. While this report is prepared by a licensed California solar contractor and inspector, it is provided strictly for informational and advisory purposes. It does not constitute financial, legal, or tax advice. Homeowners are encouraged to consult with independent financial or legal professionals regarding the execution or transfer of third-party service agreements.
                 </div>

                 <!-- Footer -->
                 <div class="border-t-4 border-slate-900 pt-6 flex justify-between items-end">
                    <div>
                        <p class="text-sm font-bold text-slate-800 uppercase tracking-tight mb-2"><i class="fas fa-screwdriver-wrench text-blue-600 mr-2"></i> ${isTPO || isPrepaid ? 'Service & maintenance covered under agreement.' : 'Homeowner responsible for service & maintenance.'}</p>
                        <div class="mt-4">
                            <p class="text-lg font-black italic text-slate-900 tracking-tighter uppercase">${co.name}</p>
                            <p class="text-[10px] font-bold text-slate-500 tracking-widest uppercase">${co.license}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-slate-400 font-black uppercase tracking-[0.2em] italic mb-4">SolarCheck Pro v1.16</p>
                    </div>
                 </div>
                `;

                document.getElementById('report-container').innerHTML = content;
                document.title = `${state.a || 'Sellers Report'} - SolarCheck Pro`;

                // Add explicit print width to the progress bars so they don't vanish on print
                setTimeout(() => {
                    const bars = document.querySelectorAll('.print-bar');
                    bars.forEach(b => {
                        b.style.minWidth = b.style.width;
                    });
                }, 100);

            } catch (err) {
                console.error("Failed to parse Sellers Report data payload:", err);
                document.getElementById('report-container').innerHTML = `<h2 class="text-2xl text-red-600 font-bold">Error loading report data.</h2><p>${err.message}</p>`;
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderReport);
        } else {
            renderReport();
        }
    </script>
</body>
</html>
