<!-- 
================================================================================
PROJECT CONTEXT: SolarCheck Professional
Current Version: v7.211 (RESTORATION: FULL 2-PAGE ADVISORY REPORT)
Date: February 2026
Architecture: Modular Single-File HTML5 (Sub-Renderer Pattern)
================================================================================

1. OVERVIEW
   A multi-purpose solar evaluation platform serving three distinct user groups:
   A. INSPECTION (Field): Simple, visual health benchmarks. (Inputs & Summary).
   B. VALUATION (Bank): USPAP-aligned DCF/Cost math. (Valuation Tab).
   C. BUYBACK (Investor): IRR-based Pro-Forma modeling. (Buyback Tab).

2. DEPLOYMENT CONSTRAINTS
   - Single-File Mandate: All assets must remain in this file. No external local files.
   - Assets: Supports absolute GitHub Raw paths for universal logo loading.
   - Printing: Uses window.printReport() for clean, asset-heavy PDF generation.

3. CORE LOGIC ENGINES
   - Bucket Model: Usable battery capacity (Total * (1-Reserve)) affects SCR.
   - Dynamic Benchmarking (v7.200): 
     * Owned: Actual vs. Physical yield model (Azimuth/Pitch/Shading).
     * TPO: Actual vs. Contractual Estimate & Legal Guarantee.
   - Performance Ratio: Central metric (Ratio of Actual vs. Benchmark).
   - DCF Valuation: Weights Income (DCF) vs. Depreciated Cost.
   - Buyback Engine: NPV of (Revenue - OpEx - CapEx) @ Target IRR. 

4. UNIVERSAL REPORTING SYSTEM (JSON-DRIVEN)
   - BLOCK LIBRARY: window.BLOCK_LIBRARY is the central rendering authority.
   - Locked Reports: Realtor Guide (2-Page) & Asset Report structures are strictly locked.

5. AI SESSION PROTOCOL (MANDATORY)
   - VERSION CONTROL: Increment version (e.g., v7.210 -> v7.211) with every change.
   - CONTEXT INTEGRITY: Never delete or simplify this header.
   - UI IMMUTABILITY: Never truncate or simplify the 5 core Tab rendering functions.
   - SINGLE SOURCE OF TRUTH: Reports must ONLY read from window.state.r or aR.
================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarCheck Professional v7.211</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .tab-content { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            body { background: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            h1, h2, h3 { page-break-after: avoid; }
            img { max-width: 100%; }
            .break-inside-avoid { break-inside: avoid; }
            .page-break { page-break-before: always; }
        }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-['Inter',sans-serif]">

    <div id="root"></div>
    <div id="report-view" class="hidden min-h-screen bg-slate-50 pb-20 absolute top-0 left-0 w-full z-50"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. GLOBAL HELPERS ---
        const GITHUB_BASE = "https://raw.githubusercontent.com/[YOUR_USERNAME]/[YOUR_REPO]/main/";

        window.cur = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v || 0);
        window.cur3 = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 3 }).format(v || 0);
        window.num = (v) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 }).format(v || 0);
        window.per = (v) => (v * 100).toFixed(1) + "%";

        window.I = function(l, v, key, t = "number", d, st = "0.01", disabled = false, handler = "handleInputChange", placeholder = "") { 
            return `<div class=""><label for="${key}" class="block text-slate-700 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><input type="${t}" step="${st}" id="${key}" placeholder="${placeholder}" class="w-full p-2 border border-slate-300 rounded text-slate-800 text-lg font-semibold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow ${disabled ? 'bg-slate-100 text-slate-500' : 'bg-white'}" value="${v}" ${disabled ? 'disabled' : ''} onchange="${handler}(event,'${key}')"/><p class="text-sm text-slate-500 mt-1 leading-snug">${d || ''}</p></div>`; 
        };
        window.Idark = function(l, v, key, t = "number", d, st = "0.01", disabled = false) { 
            return `<div class=""><label for="${key}" class="block text-blue-200 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><input type="${t}" step="${st}" id="${key}" class="w-full p-2 border border-slate-500 rounded bg-slate-700/50 text-white text-lg font-semibold focus:ring-2 focus:ring-blue-400 focus:border-blue-400 placeholder-slate-400 backdrop-blur-sm ${disabled ? 'opacity-50 cursor-not-allowed' : ''}" value="${v}" ${disabled ? 'disabled' : ''} onchange="handleInputChange(event,'${key}')"/><p class="text-sm text-blue-400 mt-1 leading-snug">${d || ''}</p></div>`; 
        };
        window.Sdark = function(l, v, key, o, d) { 
            return `<div class=""><label for="${key}" class="block text-blue-200 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><select id="${key}" class="w-full p-2 border border-slate-500 rounded bg-slate-700/50 text-white text-lg font-semibold focus:ring-2 focus:ring-blue-400 focus:border-blue-400 backdrop-blur-sm" onchange="handleInputChange(event,'${key}')">${o.map(x => `<option value="${x.v}" ${v == x.v ? 'selected' : ''}>${x.l}</option>`).join('')}</select><p class="text-sm text-blue-400 mt-1 leading-snug">${d || ''}</p></div>`; 
        };
        window.S = function(l, v, key, o, d, handler = "handleInputChange") { 
            return `<div class=""><label for="${key}" class="block text-slate-700 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><select id="${key}" class="w-full p-2 border border-slate-300 rounded text-slate-800 text-lg font-semibold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white" onchange="${handler}(event,'${key}')">${o.map(x => `<option value="${x.v}" ${v == x.v ? 'selected' : ''}>${x.l}</option>`).join('')}</select><p class="text-sm text-slate-500 mt-1 leading-snug">${d || ''}</p></div>`; 
        };
        window.R = function(l, v, s, d) { 
            return `<div class="mb-4 border-b border-slate-100 pb-3 last:border-0 last:pb-0"><div class="flex justify-between items-center text-base sm:text-lg"><span class="font-bold text-slate-700">${l}</span><span class="font-bold text-slate-900 text-lg sm:text-xl">${v} <span class="text-sm sm:text-base text-slate-600 font-normal">${s}</span></span></div>${d ? `<p class="text-sm text-slate-600 leading-tight mt-1 font-medium">${d}</p>` : ''}</div>`; 
        };
        window.C = function(t, d, children, c = 'text-slate-800', cl = '', icon = '', wrapperCl = '') {
            let iH = '';
            if (icon === '🛡️' || t.includes("Warranty")) iH = '<i class="fas fa-shield-halved mr-2 text-indigo-600"></i>';
            else if (icon === '📊' || t.includes("Performance")) iH = '<i class="fas fa-chart-line mr-2 text-green-600"></i>';
            else if (t.includes("Profile")) iH = '<i class="fas fa-solar-panel mr-2 text-blue-600"></i>';
            else if (t.includes("Economics") || t.includes("Savings") || t.includes("Homeowner Value")) iH = '<i class="fas fa-sack-dollar mr-2 text-emerald-700"></i>';
            else if (t.includes("TPO") || t.includes("Contract")) iH = '<i class="fas fa-file-contract mr-2 text-slate-700"></i>';
            else if (t.includes("Buyback") || t.includes("Deal") || t.includes("Investor")) iH = '<i class="fas fa-handshake mr-2 text-yellow-600"></i>';
            else if (t.includes("Matrix")) iH = '<i class="fas fa-table mr-2 text-blue-700"></i>';
            else if (t.includes("Analysis") || icon === 'chart-bar') iH = '<i class="fas fa-chart-bar mr-2 text-indigo-600"></i>';
            else if (t.includes("Arbitrage") || icon === 'balance-scale') iH = '<i class="fas fa-balance-scale-right mr-2 text-purple-600"></i>';
            return `<div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow duration-300 break-inside-avoid ${cl} ${wrapperCl}"><div class="border-b border-slate-100 pb-4 mb-5"><h3 class="text-2xl font-bold flex items-center ${c}">${iH}${t}</h3>${d ? `<p class="text-base text-slate-600 mt-1 font-medium">${d}</p>` : ''}</div>${children}</div>`;
        };

        // =====================================================================
        // [UI_TABS] - MODULAR COMPONENT RENDERERS
        // =====================================================================

        window.renderInputsTab = function(st, r) {
            return `<div class="tab-content space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                     <h3 class="font-bold mb-4 text-slate-800 flex items-center gap-2 text-lg uppercase tracking-wide">Site & Branding</h3>
                     <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        ${window.S("Company Profile", st.company, "company", [{v:'rsr', l:'Rocklin Solar Repair'}, {v:'shine', l:'Shine on Solar & Maintenance'}, {v:'ssoc', l:'Solar Service of Colorado'}], "Select branding for reports.", "handleCompanyChange")}
                        ${window.S("Ownership Agreement", st.o, "o", [{ v: "owned", l: "Homeowner Owned" }, { v: "lease", l: "Lease (Fixed Payment)" }, { v: "ppa", l: "PPA (Pay per kWh)" }, { v: "prepaid_lease", l: "Prepaid Lease" }, { v: "prepaid_ppa", l: "Prepaid PPA" }], "Current ownership structure.")}
                        <div class="col-span-1 sm:col-span-2">${window.I("Property Address", st.a, "a", "text", "The physical address of the installation.", "", false, "handleInputChange", "123 Solar Way, Rocklin CA")}</div>
                     </div>
                </div>
                <div class="bg-indigo-50 p-6 rounded-xl border border-indigo-100 shadow-sm">
                    <h4 class="font-bold text-indigo-900 text-lg uppercase mb-4 border-b border-indigo-200 pb-2 flex items-center gap-2"><i class="fas fa-microchip"></i> Hardware Registry</h4>
                    <div class="mb-4"><h5 class="text-xs font-bold text-indigo-800 uppercase mb-2 tracking-widest">Solar Panels</h5><div class="grid grid-cols-1 sm:grid-cols-3 gap-4">${window.I("Panel Count", st.pC, "pC", "number", "Total panels.", "1")}${window.I("Panel Watts", st.pW, "pW", "number", "Nameplate rating.")}${window.I("Panel Brand", st.panelBrand, "panelBrand", "text", "Manufacturer.")}</div></div>
                    <div class="mb-4 pt-4 border-t border-indigo-200"><h5 class="text-xs font-bold text-indigo-800 uppercase mb-2 tracking-widest">Inverter System</h5><div class="grid grid-cols-1 sm:grid-cols-4 gap-4">${window.S("Inverter Type", st.it, "it", [{ v: "string", l: "String (Central)" }, { v: "micro", l: "Microinverters" }])}${window.S("Inverter Brand", st.invBrand, "invBrand", [{v:'Enphase', l:'Enphase'}, {v:'SolarEdge', l:'SolarEdge'}, {v:'SMA', l:'SMA'}, {v:'Fronius', l:'Fronius'}, {v:'Other', l:'Other'}])}${window.I("Unit Count", st.invCount, "invCount")}${window.I("Hardware Age", st.invAge, "invAge")}</div></div>
                    <div class="pt-4 border-t border-indigo-200"><h5 class="text-xs font-bold text-indigo-800 uppercase mb-2 tracking-widest">Energy Storage & Monitoring</h5><div class="grid grid-cols-1 sm:grid-cols-4 gap-4">${window.I("Battery Brand", st.batteryBrand, "batteryBrand", "text")}${window.I("Battery Capacity (kWh)", st.b, "b", "number", "Total capacity.", "1", false, "handleBatteryChange")}${window.I("Reserve Setting (%)", st.br, "br", "number", "Outage reserve.", "5", false, "handleReserveChange")}${window.S("Cellular Comms", st.cellMon, "cellMon", [{v:'yes', l:'Active (4G/5G)'}, {v:'no', l:'Inactive / None'}])}</div></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200"><h4 class="font-bold text-slate-800 text-lg uppercase mb-4 flex items-center gap-2"><i class="fas fa-chart-line text-green-600"></i> Production & Utility</h4><div class="space-y-4">${window.I("Install Date (PTO)", st.iDt, "iDt", "date")}${window.I("Meter Reading (MWh)", st.ac, "ac", "number")}${window.I("Reading Date", st.pDt, "pDt", "date")}${window.S("Utility Preset", st.ut, "ut", [{ v: "nem2", l: "NEM 2 (CA)" }, { v: "nem3", l: "NEM 3 (CA)" }, { v: "roseville", l: "Roseville" }, { v: "smud", l: "SMUD" }, { v: "xcel_co", l: "Xcel Co" }, { v: "other", l: "Custom Rate" }], "Load regional rates.", "handleUtilityChange")}${window.I("Site Consumption (%)", st.scr, "scr", "number", "Energy used on-site pre-battery.", "0.1")}<div class="grid grid-cols-2 gap-4">${window.I("Retail Rate ($)", st.rU, "rU", "number", "Import cost.")}${window.I("Export Rate ($)", st.eU, "eU", "number", "Surplus credit.")}</div></div></div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200"><h4 class="font-bold text-slate-800 text-lg uppercase mb-4 flex items-center gap-2"><i class="fas fa-compass text-orange-500"></i> Site Characteristics</h4><div class="space-y-4">${window.S("Array Azimuth", st.or, "or", [{ v: "south", l: "South (Ideal)" }, { v: "mix", l: "Mixed" }, { v: "east_west", l: "East / West" }, { v: "north", l: "North (Poor)" }])}${window.S("Roof Pitch", st.pi, "pi", [{ v: "standard", l: "Standard (20-30°)" }, { v: "flat", l: "Flat (0-10°)" }, { v: "steep", l: "Steep (>35°)" }])}${window.S("Shading Impact", st.sh, "sh", [{ v: "none", l: "No Shade (100%)" }, { v: "some", l: "Some Shade (85%)" }, { v: "alot", l: "Heavy Shade (70%)" }])}</div></div>
                </div>
            </div>`;
        };

        window.renderContractTab = function(st, r) {
            if (st.o === 'owned') return `<div class="tab-content bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[400px] flex flex-col items-center justify-center text-center text-slate-400"><i class="fas fa-file-circle-check text-6xl mb-4 text-slate-200"></i><h3 class="text-xl font-bold text-slate-500">No Contract Data Required</h3><p class="max-w-md mt-2">Homeowner Owned assets do not require contractual audit data.</p></div>`;
            return `<div class="tab-content bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[400px]"><div class="max-w-3xl mx-auto"><div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-4"><div class="bg-blue-100 p-3 rounded-full text-blue-600 shadow-sm"><i class="fas fa-file-signature text-2xl"></i></div><div><h3 class="text-2xl font-bold text-slate-800 uppercase tracking-tight">Lease / PPA Agreement</h3><p class="text-slate-500 mt-1">Audit original contract terms.</p></div></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                <div class="space-y-4"><h4 class="font-bold text-slate-700 uppercase text-xs tracking-widest border-b pb-1">Term & Escalation</h4>${window.I("Contract Term (Years)", st.te, "te")}${window.I("Annual Escalator (%)", st.tEs, "tEs")}</div>
                <div class="space-y-4"><h4 class="font-bold text-slate-700 uppercase text-xs tracking-widest border-b pb-1">Production Guarantees</h4>${window.I("Year 1 Est. Production (kWh)", st.tE, "tE", "number", "Sales estimate.", "1", false, "handleProductionChange")}${window.I("Guaranteed Minimum (kWh)", st.tG, "tG")}</div>
                ${!st.o.includes('prepaid') ? `<div class="col-span-1 sm:col-span-2 bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-inner"><h4 class="font-bold text-slate-700 uppercase text-xs tracking-widest border-b pb-1 mb-4">Payment Structure</h4><div class="grid grid-cols-1 sm:grid-cols-2 gap-6">${window.I("Solar Rate ($/kWh)", (typeof st.tR === 'number' ? st.tR.toFixed(3) : st.tR), "tR", "number", "Initial solar price.", "0.001", false, "handleRateChange")}${window.I("Battery Fixed Fee ($)", (typeof st.paB === 'number' ? st.paB.toFixed(2) : st.paB), "paB", "number", "Monthly storage adder.", "0.01", false, "handleBatteryPaymentChange")}<div class="sm:col-span-2">${window.I("Total Monthly Payment ($)", (typeof st.pa === 'number' ? st.pa.toFixed(2) : st.pa), "pa", "number", "All-in initial monthly payment.", "0.01", false, "handlePaymentChange")}</div></div></div>` : `<div class="col-span-1 sm:col-span-2 bg-green-50 p-6 rounded-xl border border-green-200 text-center flex flex-col items-center justify-center py-8 shadow-inner"><i class="fas fa-check-circle text-green-500 text-3xl mb-2"></i><h4 class="font-bold text-green-800 uppercase text-sm tracking-widest mb-1">Prepaid Agreement</h4><p class="text-green-700 text-sm">No monthly payment liabilities exist.</p></div>`}
                <div class="col-span-1 sm:col-span-2"><h4 class="font-bold text-slate-700 uppercase text-xs tracking-widest border-b pb-1 mb-4">Full Term Forecasts</h4><div class="grid grid-cols-1 sm:grid-cols-2 gap-6">${window.I("Total Estimated (kWh)", r ? window.num(r.fTe * 1000) : 0, "fTe", "text", "", "", true)}${window.I("Total Guaranteed (kWh)", r ? window.num(r.fTg * 1000) : 0, "fTg", "text", "", "", true)}</div></div>
            </div></div></div>`;
        };

        window.renderSummaryTab = function(st, r) {
            const isTPO = ['lease', 'ppa', 'prepaid_lease', 'prepaid_ppa'].includes(st.o);
            const remTerm = isTPO ? Math.max(0, st.te - r.age).toFixed(1) : null;
            
            const benchmarkValue = isTPO ? r.estTD : r.physTD;
            const benchmarkLabel = isTPO ? "Contract Estimate" : "Physical Model";
            const benchmarkBadge = isTPO ? "bg-blue-100 text-blue-800" : "bg-indigo-100 text-indigo-800";
            
            const ratio = r.act / (benchmarkValue || 1);
            let statusLabel = "", statusColor = "", barColor = "";

            if (!isTPO) {
                if (ratio >= 0.90) { statusLabel = "Optimized"; statusColor = "text-green-600"; barColor = "bg-green-500"; }
                else if (ratio >= 0.80) { statusLabel = "Marginal"; statusColor = "text-amber-600"; barColor = "bg-amber-500"; }
                else { statusLabel = "Underperforming"; statusColor = "text-red-600"; barColor = "bg-red-500"; }
            } else {
                if (ratio >= 1.0) { statusLabel = "Optimized"; statusColor = "text-green-600"; barColor = "bg-green-500"; }
                else if (ratio >= 0.95) { statusLabel = "Performing"; statusColor = "text-emerald-600"; barColor = "bg-emerald-500"; }
                else if (ratio >= 0.85) { statusLabel = "Marginal"; statusColor = "text-amber-600"; barColor = "bg-amber-500"; }
                else { statusLabel = "Underperforming"; statusColor = "text-red-600"; barColor = "bg-red-500"; }
                if (r.act < r.guarTD) { statusLabel = "Guarantee Breach"; statusColor = "text-red-700"; barColor = "bg-red-700"; }
            }
            
            const variancePercent = Math.min(100, ratio * 100);
            const arbitrageNarrative = (isTPO) ? ((r.arbDelta > 0) ? `The solar agreement rate ($${r.rYC.toFixed(2)}) is <span class="text-green-700 font-bold">$${r.arbDelta.toFixed(2)} cheaper</span> than the Blended Utility Value.` : `The solar agreement rate ($${r.rYC.toFixed(2)}) is <span class="text-red-700 font-bold">$${Math.abs(r.arbDelta).toFixed(2)} higher</span> than the Blended Utility Value.`) : "";

            return `<div class="tab-content space-y-6">
                ${window.C("System Profile", "Physical capacity and yield snapshots.", `
                    <div class="grid grid-cols-1 ${remTerm ? 'sm:grid-cols-3' : 'sm:grid-cols-2'} gap-6 pt-2">
                        <div><p class="text-sm uppercase text-slate-600 font-bold">Rated Size</p><p class="text-4xl font-black text-blue-800">${st.sz.toFixed(2)} kW</p><p class="text-xs text-slate-500 font-medium">Total DC Power</p></div>
                        <div class="border-l pl-6"><p class="text-sm uppercase text-slate-600 font-bold">Age</p><p class="text-4xl font-black text-blue-800">${r.age.toFixed(1)} <span class="text-lg font-normal text-slate-600">Years</span></p><p class="text-xs text-slate-500 font-medium">Since PTO</p></div>
                        ${remTerm ? `<div class="border-l pl-6"><p class="text-sm uppercase text-slate-600 font-bold">Remaining</p><p class="text-4xl font-black text-indigo-600">${remTerm} <span class="text-lg font-normal text-slate-600">Years</span></p><p class="text-xs text-slate-500 font-medium">Contract Life</p></div>` : ''}
                        <div class="col-span-1 ${remTerm ? 'sm:col-span-3' : 'sm:col-span-2'} border-t pt-4 grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div><p class="text-sm text-slate-600 font-bold uppercase">Next 12 Months</p><p class="text-3xl font-bold text-slate-800">${window.num(r.estN12 / 1000)} MWh</p></div>
                            <div class="sm:border-l sm:pl-6"><p class="text-sm text-slate-600 font-bold uppercase">Daily Average</p><p class="text-3xl font-bold text-slate-800">${r.estDay.toFixed(1)} kWh</p></div>
                        </div>
                    </div>
                `, 'text-blue-800')}

                ${window.C("Rate Arbitrage Audit", "Comparison against Blended Utility Value (NEM 3.0 / Battery Adjusted).", `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 mb-4 pt-2">
                        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 shadow-inner text-center">
                            <p class="text-[10px] font-black uppercase text-slate-400 mb-2 tracking-[0.2em]">Solar Agreement Rate</p>
                            <p class="text-4xl font-black text-blue-800 italic leading-none">$${r.rYC.toFixed(2)}/kWh</p>
                        </div>
                        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 shadow-inner text-center">
                            <p class="text-[10px] font-black uppercase text-slate-400 mb-2 tracking-[0.2em]">Blended Utility Value</p>
                            <p class="text-4xl font-black text-purple-700 italic leading-none">$${r.blendedUtility.toFixed(2)}/kWh</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                         <div class="p-3 bg-slate-50 rounded-xl border text-center">
                            <p class="text-[9px] font-bold text-slate-500 uppercase">Self-Consumption</p>

                const srev = (srec && srecP) ? (pC_ / 1000) * srecP : 0;
                const net = (pC_ * uRC) + srev - ((isTPO && !isPrepaid && (age+y)<=te) ? lCA : 0); 
                dcf += net / Math.pow(1 + (dr / 100), y); uRC *= (1 + (e / 100)); lCA *= (1 + (tEs / 100)); pC_ *= 0.995;
            }
            window.state.aR = { cost: cV - rp, inc: dcf - rp, val: Math.max(0, (dcf * (w / 100)) + (cV * (1 - (w / 100))) - rp) };
            window.calculateBuyback(s, age, cP, window.state.it, blendedUtility, e);
        };

        window.calculateBuyback = function(sz, age, prod, it, blendedRate, e) {
            const { bb_rate, bb_term, bb_irr, bb_opex, bb_capex, rp } = window.state;
            let sum = 0, totalRev = 0, totalOpex = 0, schedule = [];
            let pC_ = prod;
            for (let i = 0; i < bb_term; i++) {
                const rev = pC_ * bb_rate, op = (sz * bb_opex) + 100;
                totalRev += rev; totalOpex += op; let net = rev - op;
                sum += net / Math.pow(1 + (bb_irr/100), i+1);
                schedule.push({ year: i+1, revenue: rev, net, expectedGen: pC_ });
                pC_ *= 0.995;
            }
            window.state.bb_offer = Math.max(0, sum - rp);
            window.state.bb_schedule = schedule;
            window.state.bb_metrics = { totalRev, totalOpex, totalNet: totalRev - totalOpex, totalProfit: Math.max(0, (totalRev - totalOpex) - window.state.bb_offer) };
        };

        // --- 4. UNIVERSAL JSON RENDERER (LOCKED) ---
        const BLOCK_LIBRARY = {
            BRANDED_HERO: (c) => `<div class="bg-slate-900 text-white p-8 rounded-3xl mb-4 shadow-xl relative overflow-hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-b-8 border-blue-600"><div class="relative z-10"><h1 class="text-3xl font-black uppercase mb-1 tracking-tight italic leading-tight">${c.title}</h1><p class="text-[10px] opacity-70 font-bold tracking-widest uppercase mb-4">${c.subtitle}</p><div class="pt-4 border-t border-white/10 font-bold text-base italic opacity-90"><i class="fas fa-location-dot mr-2 text-blue-400"></i>${c.address || 'Asset Location Pending'}</div></div><div class="flex flex-col items-end gap-2 text-right"><img src="${c.logo}" class="h-16 w-auto object-contain" onerror="this.style.display='none'"><div class="text-[9px] uppercase font-black tracking-widest opacity-60"><p>${c.compName}</p><p>${c.compLic}</p><p>${new Date().toLocaleDateString()}</p></div></div></div>`,
            STATUS_BANNER: (c) => `<div class="grid grid-cols-6 gap-2 mb-4">${c.items.map(item => `<div class="bg-white p-3 rounded-xl border border-slate-300 shadow-sm text-center flex flex-col items-center justify-center gap-1"><span class="text-[7px] font-black text-slate-700 uppercase tracking-tighter">${item}</span></div>`).join('')}<div class="bg-slate-800 p-3 rounded-xl text-white text-center flex flex-col items-center justify-center border border-slate-700 shadow-lg"><div class="flex items-center gap-1 text-green-400 font-black text-[9px] italic">VERIFIED</div></div></div>`,
            STAT_GRID: (c) => `<div class="grid grid-cols-2 gap-3 mb-4">${c.items.map(i => `<div class="bg-slate-50 p-6 rounded-2xl border border-slate-300 shadow-md text-center"><p class="text-[9px] uppercase font-black text-slate-500 mb-1 tracking-[0.2em]">${i.label}</p><p class="text-3xl font-black ${i.color || 'text-slate-900'} italic tracking-tighter">${i.value}</p></div>`).join('')}</div>`,
            ARBITRAGE_GRID: (c) => `<div class="grid grid-cols-2 gap-3 mb-4 break-inside-avoid"><div class="bg-indigo-50 p-5 rounded-2xl border border-indigo-200 text-center"><p class="text-[8px] uppercase font-black text-indigo-400 mb-1 tracking-[0.2em]">Solar Energy Rate</p><p class="text-2xl font-black text-indigo-700 italic tracking-tighter">$${c.solarRate.toFixed(2)}/kWh</p></div><div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-center"><p class="text-[8px] uppercase font-black text-slate-500 mb-1 tracking-[0.2em]">Utility Retail Rate</p><p class="text-2xl font-black text-slate-900 italic tracking-tighter">$${(c.utilityRate || 0.35).toFixed(2)}/kWh</p></div><div class="col-span-2 p-4 bg-purple-50 rounded-xl border border-purple-200 shadow-sm flex gap-3 items-center"><div class="text-lg text-purple-400"><i class="fas fa-scale-balanced"></i></div><p class="text-[10px] font-bold text-purple-900 leading-tight uppercase tracking-tight">The solar energy rate is currently <span class="underline decoration-purple-300 decoration-2 font-black">$${Math.abs(c.delta).toFixed(2)}/kWh ${c.delta > 0 ? 'cheaper' : 'higher'}</span> than the local grid.</p></div></div>`,
            DATA_LIST: (c) => `<div class="bg-slate-50 p-8 rounded-3xl border border-slate-300 shadow-md mb-4 break-inside-avoid"><h3 class="text-[10px] font-black uppercase mb-6 tracking-[0.3em] flex items-center border-b border-slate-200 pb-4 text-slate-500">${c.title}</h3><div class="space-y-4">${c.rows.map(r => `<div class="flex justify-between items-center py-1 ${r.border ? 'border-t border-slate-200 mt-4 pt-4' : ''}"><div><span class="font-black text-slate-900 text-sm uppercase tracking-wide">${r.l}</span></div><span class="font-black text-xl ${r.c || 'text-slate-900'} tracking-tighter italic">${r.v}</span></div>`).join('')}</div></div>`,
            GRID_BOX: (c) => `<div class="bg-white border border-slate-300 rounded-3xl p-8 mb-4 shadow-md break-inside-avoid"><h3 class="font-black uppercase text-slate-500 text-[9px] tracking-[0.3em] mb-8 border-b border-slate-200 pb-4">${c.title}</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-10">${c.columns.map(col => `<div><h4 class="font-black text-slate-900 mb-6 uppercase text-[11px] italic underline decoration-blue-600 decoration-2 underline-offset-8">${col.header}</h4><ul class="space-y-4 text-sm font-bold text-slate-900">${col.items.map(item => `<li class="flex gap-3 items-start"><i class="fas fa-square-check text-blue-600 mt-1"></i> <span>${item}</span></li>`).join('')}</ul></div>`).join('')}</div></div>`,
            SECTION: (c) => `<div class="mb-8 break-inside-avoid px-2"><h4 class="font-black text-slate-900 uppercase text-sm tracking-widest mb-4 border-l-4 border-blue-600 pl-4">${c.title}</h4><p class="text-sm text-slate-900 leading-relaxed text-justify font-medium">${c.body}</p></div>`,
            PAGE_BREAK: () => `<div class="page-break my-6 border-t-4 border-slate-100 relative"><span class="absolute top-[-10px] left-1/2 translate-x-[-50%] bg-slate-50 px-4 py-0.5 rounded-full text-[8px] font-black text-slate-400 uppercase tracking-[0.5em] shadow-sm">Next Page</span></div>`,
            NARRATIVE: (c) => `<div class="p-8 rounded-3xl border border-slate-300 bg-slate-50 mb-4 text-center break-inside-avoid shadow-sm"><p class="text-xs font-bold text-slate-900 leading-relaxed italic mx-auto max-w-2xl">${c.body}</p></div>`
        };

        window.renderReport = function(config, state) {
            const comp = COMPANIES[state.company] || COMPANIES['rsr'];
            const content = config.map(b => BLOCK_LIBRARY[b.type] ? BLOCK_LIBRARY[b.type](b.data) : '').join('');
            const logoPath = (comp.logo.startsWith('http') ? comp.logo : GITHUB_BASE + comp.logo);
            const footer = `<div class="mt-12 pt-6 border-t-2 border-slate-200 flex justify-between items-center break-inside-avoid opacity-80"><div class="flex items-center gap-4"><img src="${logoPath}" class="h-10 w-auto object-contain grayscale" onerror="this.style.display='none'"><div><h4 class="font-black text-slate-900 uppercase text-xs">${comp.name}</h4><p class="text-[8px] text-slate-600 font-bold">${comp.license}</p></div></div><div class="text-right text-[8px] text-slate-700 font-black uppercase tracking-widest"><p>${comp.phone}</p><p>${comp.email}</p><p>${comp.website}</p></div></div>`;
            return content + footer;
        };

        window.handleGenerateReport = function(type) {
            window.closeModal();
            const rv = document.getElementById('report-view'), root = document.getElementById('root'), i = window.state, r = i.r;
            const comp = COMPANIES[i.company] || COMPANIES['rsr'];
            const logoPath = (comp.logo.startsWith('http') ? comp.logo : GITHUB_BASE + comp.logo);
            root.classList.add('hidden'); rv.classList.remove('hidden'); rv.innerHTML = '<div class="h-screen flex items-center justify-center font-black animate-pulse uppercase tracking-widest text-slate-900">Composing Branded Advisory Report...</div>';
            
            const isTPO = ['lease', 'ppa', 'prepaid_lease', 'prepaid_ppa'].includes(i.o);
            const benchmarkValue = isTPO ? r.estTD : r.physTD;
            const ratio = r.act / (benchmarkValue || 1);

            const config = [
                // --- PAGE 1: EXECUTIVE DASHBOARD ---
                { type: 'BRANDED_HERO', data: { title: "Solar Verification & Advisory", subtitle: "Independent analysis of specifications, financial impact, and contractual obligations.", address: i.a, logo: logoPath, compName: comp.name, compLic: comp.license } },
                { type: 'STATUS_BANNER', data: { items: ['EQUIPMENT INSPECTED', 'PRODUCTION VERIFIED', 'SAVINGS CALCULATED', 'CONTRACT REVIEWED', 'WARRANTY AUDITED'] } },
                { type: 'STAT_GRID', data: { items: [
                    {label: 'System Capacity', value: i.sz.toFixed(2)+' kW'}, 
                    {label: 'Est. Daily Avg', value: r.estDay.toFixed(1)+' kWh'},
                    {label: 'Remaining Term', value: (i.o.includes('owned') ? 'N/A' : (i.te-r.age).toFixed(1)+' Years')},
                    {label: 'Ownership Status', value: (i.o.includes('owned') ? 'Title Owned' : '3rd Party (TPO)'), color: 'text-blue-700'}
                ] } },
                { type: 'ARBITRAGE_GRID', data: { solarRate: r.rYC, utilityRate: i.rU, delta: r.arbDelta, discount: r.arbDiscount } },
                { type: 'DATA_LIST', data: { title: 'Monthly Cash Flow Analysis', rows: [
                    {l:'Est. Monthly Utility Savings', v: window.cur(r.potSav*r.pr/12)}, 
                    {l:'Less: Solar Payment', v: '-'+window.cur(i.pa), c:'text-red-700'}, 
                    {l:'Net Monthly Savings', v: window.cur((r.potSav*r.pr/12)-(i.pa||0)), border:true, c:'text-green-700'}
                ] } },
                { type: 'PAGE_BREAK' },
                // --- PAGE 2: TECHNICAL DETAIL ---
                { type: 'GRID_BOX', data: { title: 'Verified Equipment Registry', columns: [ 
                    { header: 'Hardware Specifications', items: [
                        `Modules: ${i.pC} x ${i.panelBrand} ${i.pW}W Panels`,
                        `Inverter: ${i.invCount} x ${i.invBrand} (${i.it.toUpperCase()})`,
                        `Storage: ${i.b > 0 ? `${i.b} kWh ${i.batteryBrand} Battery` : 'No storage installed.'}`
                    ] }, 
                    { header: 'Physical Environment', items: [
                        `Orientation: ${i.or.replace('_',' ').toUpperCase()}`,
                        `Pitch: ${i.pi.toUpperCase()}`,
                        `Shading: ${i.sh.toUpperCase()}`
                    ] }
                ] } },
                { type: 'GRID_BOX', data: { title: 'Warranty & Responsibility Audit', columns: [ 
                    { header: 'Maintenance', items: [
                        `Provider: ${i.o.includes('owned') ? 'Homeowner' : 'TPO Provider covers normal wear.'}`, 
                        `Inverter Replacement: ${i.it === 'micro' ? 'Manufacturer 25y' : 'Service Included (12y).'}`, 
                        `Monitoring: Gateway connection active.`
                    ] }, 
                    { header: 'Requirements', items: [
                        `Transfer: Buyer assumes remaining payments.`, 
                        `Credit: Soft pull required by lessor.`, 
                        `Timeline: 7-14 days for processing.`
                    ] } 
                ] } },
                { type: 'DATA_LIST', data: { title: 'Long-Term Value Projection', rows: [
                    {l:'Est. Future Utility Savings', v: window.cur(r.futSav)}, 
                    {l:'Less: Remaining Payments', v: '-'+window.cur(r.remCost), c:'text-red-700'}, 
                    {l:'Projected Contract Savings', v: window.cur(r.futSavNet), border:true, c:'text-green-700'}
                ] } },
                { type: 'SECTION', data: { title: "EXECUTIVE SUMMARY", body: `This home at ${i.a || "this address"} includes a ${i.sz.toFixed(2)} kW solar energy system that has been physically inspected, production-verified, and contract-reviewed. This summary explains what those verified findings mean for a future homeowner and how the system contributes to the overall value of the property.` } },
                { type: 'SECTION', data: { title: "EQUIPMENT & PRODUCTION VERIFICATION", body: `The solar equipment was physically inspected and system production was confirmed through monitoring data. The ${i.sz.toFixed(2)} kW system is estimated to produce approximately ${window.num(r.estN12)} kWh per year, offsetting a meaningful portion of the home’s electricity usage and reducing exposure to future rate increases.` } },
                { type: 'SECTION', data: { title: "MONTHLY & LONG-TERM POSITION", body: `The system is estimated to generate a projected positive net position of about ${window.cur((r.potSav*r.pr/12)-(i.pa||0))} per month. Over the remaining ${Math.floor(i.te-r.age)} years of the agreement, projected future utility savings of ${window.cur(r.futSav)} are estimated to result in a projected net positive position of approximately ${window.cur(r.futSavNet)}.` } },
                { type: 'SECTION', data: { title: "MAINTENANCE & RESPONSIBILITY", body: `Monitoring and major equipment performance are covered by the provider under the current agreement structure, ensuring pricing stability by securing a portion of the home’s energy costs without unexpected repair expenses.` } },
                { type: 'NARRATIVE', data: { body: "Disclaimer: This independent report is based on provided system specifications and historical utility data. Future savings are estimates and depend on weather, usage patterns, and utility rate changes." } }
            ];
            rv.innerHTML = `<div class="max-w-4xl mx-auto p-12 bg-white min-h-screen shadow-2xl" id="report-content">${window.renderReport(config, i)}</div><div class="fixed bottom-0 left-0 right-0 bg-white border-t p-6 flex justify-end gap-3 no-print z-50"><button onclick=\"window.open(window.location.href, '_blank')\" class=\"bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-sm shadow-xl flex items-center gap-2 transition-all hover:scale-105 active:scale-95\"><i class=\"fas fa-expand\"></i> Full Screen</button><button onclick="window.printReport()" class="bg-indigo-600 text-white px-8 py-4 rounded-xl font-black uppercase shadow-xl hover:scale-105">Open Printable Report</button><button onclick="window.closeReport()" class="border-2 p-4 px-8 rounded-xl font-black uppercase text-slate-700">Close</button></div>`;
            window.scrollTo(0, 0);
        };

        // --- 5. UTILITY BINDINGS ---
        window.closeReport = () => { document.getElementById('report-view').classList.add('hidden'); document.getElementById('root').classList.remove('hidden'); window.scrollTo(0, 0); window.render(); };
        window.printReport = () => { const c = document.getElementById('report-content').innerHTML; const win = window.open('', '_blank'); win.document.write(`<html><head><script src="https://cdn.tailwindcss.com"><\/script><style>@media print { .page-break { page-break-before: always; } }</style></head><body onload="window.print()"><div class="p-10 max-w-[850px] mx-auto">${c}</div></body></html>`); win.document.close(); };
        window.updateState = function(k, v) { window.state[k] = v; window.calculate(); window.render(); };
        window.handleInputChange = function(e, k) { let v = e.target.value; if (e.target.type === 'number') v = v === "" ? "" : parseFloat(v); window.state[k] = v; window.calculate(); window.render(); };
        window.handleCompanyChange = function(e) { window.state.company = e.target.value; localStorage.setItem('solarCheck_company', e.target.value); window.render(); };
        window.handleProductionChange = function(e) { window.state.tE = parseFloat(e.target.value); window.calculate(); window.render(); };
        window.handleRateChange = function(e) { window.state.tR = parseFloat(e.target.value); if(window.state.tE) window.state.pa = parseFloat(((window.state.tR * window.state.tE)/12).toFixed(2)); window.calculate(); window.render(); };
        window.handlePaymentChange = function(e) { window.state.pa = parseFloat(e.target.value); if(window.state.tE > 0) window.state.tR = parseFloat(((window.state.pa * 12) / window.state.tE).toFixed(4)); window.calculate(); window.render(); };
        window.handleBatteryChange = function(e) { window.state.b = parseFloat(e.target.value) || 0; window.calculate(); window.render(); };
        window.handleReserveChange = function(e) { window.state.br = parseFloat(e.target.value) || 0; window.calculate(); window.render(); };
        window.handleUtilityChange = function(e) { const v = e.target.value; window.state.ut = v; const rates = { nem2: { r: 0.48, e: 0.45, esc: 9.0 }, nem3: { r: 0.48, e: 0.05, esc: 9.0 }, roseville: { r: 0.16, e: 0.06, esc: 2.75 }, smud: { r: 0.19, e: 0.07, esc: 3.5 }, xcel_co: { r: 0.16, e: 0.16, esc: 3.5 }, other: { r: 0.35, e: 0.05, esc: 3.5 } }; if (rates[v]) { window.state.rU = rates[v].r; window.state.eU = rates[v].e; window.state.e = rates[v].esc; } window.calculate(); window.render(); };
        window.openModal = (id) => { window.state.activeModal = id; window.render(); };
        window.closeModal = () => { window.state.activeModal = null; window.render(); };

        window.render = function() {
            const { activeTab, activeModal, r, aR } = window.state;
            const root = document.getElementById('root'); if (!root) return;
            let tabContent = "";
            if (activeTab === 'inputs') tabContent = window.renderInputsTab(window.state, r);
            else if (activeTab === 'contract') tabContent = window.renderContractTab(window.state, r);
            else if (activeTab === 'summary' && r) tabContent = window.renderSummaryTab(window.state, r);
            else if (activeTab === 'valuation' && aR) tabContent = window.renderValuationTab(window.state, aR);
            else if (activeTab === 'buyback' && r) tabContent = window.renderBuybackTab(window.state, r);

            root.innerHTML = `<div class="min-h-screen bg-slate-50 pb-10"><div class="bg-[#005088] text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md"><div class="flex items-center gap-3"><span class="text-3xl"><i class="fas fa-sun text-yellow-400"></i></span><div><h1 class="font-bold text-xl sm:text-2xl tracking-tight">SolarCheck</h1><p class="text-xs opacity-90 font-black uppercase tracking-widest">Pro v7.211</p></div></div><div class=\"flex items-center gap-2\"><button onclick=\"window.open(window.location.href, '_blank')\" class=\"bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-sm shadow-xl flex items-center gap-2 transition-all hover:scale-105 active:scale-95\"><i class=\"fas fa-expand\"></i> Full Screen</button><button onclick=\"openModal('print-modal')\" class=\"bg-yellow-400 text-black px-5 py-2.5 rounded-xl font-black text-sm shadow-xl flex items-center gap-2 transition-all hover:scale-105 active:scale-95\"><i class=\"fas fa-file-pdf\"></i> Reports</button></div></div><div class=\"bg-white border-b sticky top-20 z-40 px-4 flex gap-1 pt-2 no-print overflow-x-auto shadow-sm\">${['inputs','contract','summary','valuation','buyback'].map(t => `<button onclick=\"updateState('activeTab', '${t}')\" class=\"flex-1 py-4 border-b-4 font-black transition-all ${activeTab === t ? 'border-[#005088] text-[#005088]' : 'border-transparent text-slate-400'} uppercase text-xs tracking-widest whitespace-nowrap flex items-center justify-center gap-2\"><i class=\"fas ${t === 'inputs' ? 'fa-edit' : t === 'contract' ? 'fa-file-signature' : t === 'summary' ? 'fa-list-check' : t === 'valuation' ? 'fa-scale-balanced' : 'fa-handshake'} text-lg\"></i>${t}</button>`).join('')}</div><div class=\"max-w-5xl mx-auto p-4 sm:p-6\">${tabContent}</div><dialog id=\"print-modal\" class=\"modal p-0 rounded-3xl shadow-2xl border-0 overflow-hidden\"><div class=\"bg-white p-10 w-80 relative text-center\"><button onclick=\"closeModal()\" class=\"absolute top-5 right-5 text-slate-300 hover:text-slate-600\"><i class=\"fas fa-times text-2xl\"></i></button><h3 class=\"font-black mb-8 uppercase text-xs tracking-widest border-b pb-4\">Generate Report</h3><button onclick=\"handleGenerateReport('realtor')\" class=\"w-full text-left p-4 border-2 border-slate-50 rounded-2xl hover:bg-blue-50 transition-all font-black uppercase text-[10px] tracking-widest\">ADVISORY REPORT</button></div></dialog></div>`;
            if (activeModal) { const m = document.getElementById(activeModal); if (m && !m.open) m.showModal(); }
        };

        document.addEventListener('DOMContentLoaded', () => { window.calculate(); window.render(); });
    </script>
</body>
</html>
