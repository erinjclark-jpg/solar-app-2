<!-- 
================================================================================
PROJECT CONTEXT: SolarCheck Professional
Current Version: v7.261 (STRICT TERMINOLOGY ALIGNMENT - DYNAMIC ADVISORY LOGIC)
Date: March 2026
Architecture: Modular Single-File HTML5 (Sub-Renderer Pattern)
================================================================================

1. OVERVIEW
   Multi-purpose solar platform: Inspection (Field), Valuation (Bank).
   Investor Buyback logic moved to standalone deep-linked module.

2. AI SESSION PROTOCOL (STRICT ADHERENCE REQUIRED - DO NOT REMOVE)
   A. CARRY FORWARD: This header and 'window.UI_TEXT' / 'window.UI_NARRATIVES' 
      must be included in every generated version. DO NOT simplify or paraphrase.
   B. NO TRUNCATION: Always output 100% of the code. Never use placeholders like "...".
   C. VERSION CONTROL: Increment version (v7.xxx) with every single change.
   D. UI TEXT LOCK: NEVER modify descriptions or tooltips in the UI_TEXT object 
      unless the user explicitly requests a terminology change.
   E. ARCHITECTURE: All HTML, CSS, and JS must remain in this one file.
   F. SINGLE SOURCE of TRUTH: All UI elements must pull strings from window.UI_TEXT.
      All results must be calculated in calculate() and stored in window.state.r/aR.

3. CORE LOGIC ENGINES (LOCKED)
   - BUCKET MODEL: Usable = Total * (1-Reserve). SCR boost = Battery / Daily Gen.
   - PERFORMANCE RATIO: Actual / Benchmark. (Priority: Guarantee > Est > Phys).
   - VALUATION: USPAP Blended. TPO split into Contract Savings vs Residual.
   - ESCALATION: TPO Escalator applies to both Solar and Battery fixed fees.
================================================================================

<!DOCTYPE html>

</head>

            solYC_label: { l: "Solar Payment", d: "Escalated portion for energy generation." },

                            <h4 class="text-xs font-black text-slate-800 uppercase tracking-widest mb-6 flex items-center gap-2"><i class="fas fa-handshake-angle text-blue-600"></i> ${labels.transTimeline.l}</h4>
                            <ul class="space-y-6 text-xs font-bold text-slate-700 leading-snug">
                                <li class="flex gap-4 border-b border-slate-100 pb-4"><i class="fas fa-file-contract text-blue-400 mt-0.5"></i> <span>Qualification: <p class="font-medium text-slate-500 mt-1">Buyer assumes the payment plan at closing.</p></span></li>
                                <li class="flex gap-4 border-b border-slate-100 pb-4"><i class="fas fa-id-card text-blue-400 mt-0.5"></i> <span>Credit Check: <p class="font-medium text-slate-500 mt-1">Standard simple check required by the solar company.</p></span></li>
                                <li class="flex gap-4"><i class="fas fa-clock text-blue-400 mt-0.5"></i> <span>Timeline: <p class="font-medium text-slate-500 mt-1">Usually takes about 1-2 weeks to finalize.</p></span></li>
                            </ul>
                        </div>
                    </div>

                    <div class="bg-slate-900 p-12 rounded-[40px] text-white relative overflow-hidden mt-auto mb-10 shadow-2xl">
                        <div class="relative z-10 grid grid-cols-2 gap-12">
                            <div class="space-y-4">
                                <p class="text-blue-400 text-[10px] font-black uppercase tracking-[0.4em] italic mb-1">Long-Term Value Forecast</p>
                                
                                <div class="grid grid-cols-1 gap-2 mb-4">
                                    <div class="flex justify-between items-center text-[11px] font-black uppercase tracking-widest"><span class="text-slate-400">Solar Power Value</span><span class="text-emerald-400">$${r.blendedUtility.toFixed(2)} / kWh</span></div>
                                    <div class="flex justify-between items-center text-[11px] font-black uppercase tracking-widest border-b border-slate-700 pb-2"><span class="text-slate-400">TPO Solar Rate</span><span class="text-red-400">$${r.rYC_sol.toFixed(3)} / kWh</span></div>
                                </div>

                                <div class="flex justify-between items-end border-b-2 border-slate-700 pb-4"><span class="text-[11px] font-black text-slate-400 uppercase tracking-widest">Net Savings Over Remainder of Term</span></div>
                                <div class="pt-6 flex flex-col">
                                    <span class="text-7xl font-black italic tracking-tighter ${isNegativeTerm ? 'text-red-400' : 'text-emerald-400'} leading-none">${window.cur(Math.abs(r.futSavNet))}</span>
                                    <p class="text-xs font-bold text-slate-400 mt-2 uppercase tracking-widest italic">${isNegativeTerm ? 'Cumulative Financial Cost' : 'Cumulative Financial Advantage'}</p>
                                </div>
                            </div>
                            <div class="flex flex-col justify-center border-l-4 border-slate-800 pl-16 space-y-6">
                                <div><p class="text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">Utility Rate Stability</p><p class="text-2xl font-black text-slate-100 italic">SECURE</p></div>
                                <div><p class="text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">Home Value Impact</p><p class="text-2xl font-black ${isNegativeTerm ? 'text-amber-500' : 'text-emerald-400'} italic">${isNegativeTerm ? 'NEUTRAL' : 'POSITIVE'}</p></div>
                            </div>
                        </div>
                        <div class="absolute right-[-2%] bottom-[-5%] text-9xl text-white/5"><i class="fas fa-sack-dollar"></i></div>
                    </div>
                </div>

                <!-- PAGE 3: NARRATIVE SUMMARY -->
                <div class="p-16 max-w-4xl mx-auto min-h-[1056px] relative border-t-8 border-blue-600 shadow-2xl report-card bg-white flex flex-col page-break">
                    <div class="flex justify-between items-center mb-12 border-b-4 border-slate-900 pb-8">
                        <h2 class="text-2xl font-black text-slate-900 uppercase tracking-widest italic">${labels.narrativeHeader.l}</h2>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Reference ID: ${reportId}</span>
                    </div>

                    <div class="space-y-10 text-slate-700 leading-relaxed max-w-3xl">
                        <p class="text-xl font-bold text-slate-900 border-l-[12px] ${isUnderperforming ? 'border-amber-500' : 'border-blue-600'} pl-8 py-4 bg-slate-50 rounded-r-3xl">
                            The solar energy system at <strong>${a || 'this property'}</strong> has been thoroughly reviewed. ${isUnderperforming ? 'Our audit indicates that the system is currently underperforming relative to its technical design.' : 'It is performing as intended and is providing immediate financial benefits by reducing the monthly cost of power.'}
                        </p>
                        
                        <div class="space-y-4">
                            <h4 class="text-sm font-black text-slate-900 uppercase tracking-[0.3em] flex items-center gap-4"><span class="w-16 h-1 bg-blue-600"></span> ${labels.narrLabelEquip.l}</h4>
                            <p class="text-base text-slate-600">The hardware—including panels and inverters—was inspected for integrity. ${isUnderperforming ? 'While the equipment is operational, the metered energy harvest is lower than expected for a system of this size and age. This could be due to excessive shading, hardware degradation, or communication gaps in the monitoring software.' : 'The system matches the legal agreement on file and is verified as functional and professionally installed. The panels observed are clean and generating power efficiently.'}</p>
                        </div>

                        <div class="space-y-4">
                            <h4 class="text-sm font-black text-slate-900 uppercase tracking-[0.3em] flex items-center gap-4"><span class="w-16 h-1 bg-blue-600"></span> ${labels.narrLabelProd.l}</h4>
                            <p class="text-base text-slate-600">This ${sz.toFixed(2)} kW system generated approximately <strong>${window.num(r.act)} MWh</strong> of energy since installation. ${isUnderperforming ? 'This production level represents a shortfall against our physical benchmark. We recommend a technical onsite diagnostic to ensure the inverter string logic or microinverter reporting is synchronized correctly.' : 'This is a high-producer, generating enough energy to offset a significant majority of the home’s electricity usage, effectively shielding the owner from rising utility costs.'}</p>
                        </div>

                        <div class="space-y-4">
                            <h4 class="text-sm font-black text-slate-900 uppercase tracking-[0.3em] flex items-center gap-4"><span class="w-16 h-1 bg-blue-600"></span> ${labels.narrLabelCash.l}</h4>
                            <p class="text-base text-slate-600">${isNegativeCashFlow ? 'Currently, the monthly solar payment is higher than the calculated utility savings. This results in a net monthly cost of about <strong>' + window.cur(Math.abs(r.actSavNet / 12)) + '</strong>. Homeowners in this position often rely on future utility inflation to reach a "break-even" point where the solar becomes cheaper than the grid.' : 'The math is simple: the solar bill is lower than the utility savings. Every month, this system creates approximately <strong>' + window.cur(r.actSavNet / 12) + '</strong> in net profit for the home. It is a "cash-flow positive" asset.'}</p>
                        </div>

                        <div class="space-y-4">
                            <h4 class="text-sm font-black text-slate-900 uppercase tracking-[0.3em] flex items-center gap-4"><span class="w-16 h-1 bg-blue-600"></span> ${labels.narrLabelTerm.l}</h4>
                            <p class="text-base text-slate-600">With <strong>${remAssetYears} years</strong> left on the agreement, ${isNegativeTerm ? 'the total remaining cost of the solar agreement is projected to exceed the utility savings by ' + window.cur(Math.abs(r.futSavNet)) + '. This system is currently acting as a utility hedge rather than a direct savings vehicle.' : 'the total projected net benefit is over <strong>' + window.cur(r.futSavNet) + '</strong>. This represents a significant long-term reduction in the home\'s total cost of ownership.'}</p>
                        </div>

                        <div class="space-y-4">
                            <h4 class="text-sm font-black text-slate-900 uppercase tracking-[0.3em] flex items-center gap-4"><span class="w-16 h-1 bg-blue-600"></span> ${labels.narrLabelMaint.l}</h4>
                            <p class="text-base text-slate-600">Regardless of production performance, service and monitoring are handled under the current agreement structure, ensuring that major repairs do not become an unexpected out-of-pocket expense for the homeowner.</p>
                        </div>
                    </div>

                    <div class="mt-auto pt-10 border-t-8 border-slate-900 flex justify-between items-end">
                        <div class="text-left">
                            <p class="text-[11px] font-black text-slate-400 uppercase tracking-[0.4em] mb-2 italic">Certified Inspector</p>
                            <p class="text-3xl font-black italic text-slate-900 tracking-tighter uppercase">${co.name}</p>
                            <p class="text-xs font-bold text-slate-500">${co.license} <span class="mx-3 text-slate-300">|</span> ${new Date().toLocaleDateString()}</p>
                        </div>
                        <div class="no-print pb-2 flex gap-4">
                            <button onclick="window.printReport()" class="bg-blue-600 text-white px-12 py-5 rounded-3xl font-black uppercase text-xs tracking-widest shadow-2xl transition-all hover:bg-blue-500 active:scale-95 border-b-4 border-blue-800">Print Report</button>
                            <button onclick="window.closeReport()" class="bg-slate-100 text-slate-700 px-12 py-5 rounded-3xl font-black uppercase text-xs tracking-widest transition-all hover:bg-slate-200 border-b-4 border-slate-300">Back</button>
                        </div>
                    </div>
                </div>
            </div>`;
            reportView.innerHTML = content;
            reportView.classList.remove('hidden');
            root.classList.add('hidden');
            window.closeModal();
            window.scrollTo(0,0);
        };

        // --- MAIN RENDERER ---
        window.render = function() {
            const { activeTab, r, aR } = window.state;
            const root = document.getElementById('root'); if (!root) return;
            let tabContent = "";
            if (activeTab === 'inputs') tabContent = window.renderInputsTab(window.state, r);
            else if (activeTab === 'contract') tabContent = window.renderContractTab(window.state, r);
            else if (activeTab === 'summary' && r) tabContent = window.renderSummaryTab(window.state, r);
            else if (activeTab === 'valuation' && aR) tabContent = window.renderValuationTab(window.state, aR);

            root.innerHTML = `
                <div class="min-h-screen bg-slate-200 pb-10">
                    <div class="bg-slate-900 text-white px-4 sm:px-6 py-3 sm:py-4 sticky top-0 z-50 flex justify-between items-center shadow-lg border-b border-white/5 gap-2">
                        <div class="flex items-center gap-2 sm:gap-4 min-w-0">
                            <span class="text-2xl sm:text-3xl flex-shrink-0"><i class="fas fa-sun text-yellow-400"></i></span>
                            <div class="min-w-0 truncate"><h1 class="font-bold text-lg sm:text-2xl tracking-tighter italic truncate">SolarCheck Pro</h1><p class="text-[7px] sm:text-[9px] opacity-60 font-black uppercase tracking-[0.4em]">v7.261</p></div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <button onclick="window.open(window.location.href, '_blank')" class="header-btn bg-slate-800 text-white/80 p-2 sm:px-4 sm:py-2.5 rounded-xl text-sm shadow-xl transition-all hover:bg-slate-700 active:scale-95"><i class="fas fa-expand"></i></button>
                            <button onclick="openModal('print-modal')" class="header-btn bg-blue-600 text-white px-3 sm:px-6 py-2 sm:py-2.5 rounded-xl font-black text-[10px] sm:text-xs uppercase tracking-widest shadow-xl flex items-center gap-2 transition-all hover:bg-blue-500 active:scale-95"><i class="fas fa-file-pdf"></i> <span class="hidden xs:inline">Reports</span></button>
                        </div>
                    </div>
                    <div class="bg-white/90 backdrop-blur-md border-b sticky top-[56px] sm:top-[72px] z-40 px-2 sm:px-4 flex gap-1 pt-1 no-print overflow-x-auto shadow-sm no-scrollbar">
                        ${['inputs','contract','summary','valuation'].map(t => `<button onclick="updateState('activeTab', '${t}')" class="flex-1 py-3 sm:py-5 border-b-4 font-black transition-all ${activeTab === t ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'} uppercase text-[8px] sm:text-[10px] tracking-widest sm:tracking-[0.2em] whitespace-nowrap flex flex-col items-center justify-center gap-1 sm:gap-2"><i class="fas ${t === 'inputs' ? 'fa-edit' : t === 'contract' ? 'fa-file-signature' : t === 'summary' ? 'fa-list-check' : t === 'valuation' ? 'fa-scale-balanced' : 'fa-question'} text-base sm:text-xl"></i>${t}</button>`).join('')}
                    </div>
                    <div class="max-w-5xl mx-auto p-4 sm:p-8">${tabContent}</div>
                    <dialog id="print-modal" class="modal p-0 rounded-[32px] shadow-2xl border-0 overflow-hidden bg-white">
                        <div class="p-8 sm:p-10 w-full relative text-center">
                            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-300 hover:text-slate-600 transition-colors"><i class="fas fa-times text-2xl"></i></button>
                            <h3 class="font-black mb-6 uppercase text-[9px] tracking-[0.4em] border-b border-slate-100 pb-5 text-slate-400">Generate Audit</h3>
                            <div class="space-y-3">
                                <button onclick="handleGenerateReport('realtor')" class="w-full text-left p-5 sm:p-6 border-2 border-slate-50 rounded-2xl hover:bg-blue-50 hover:border-blue-200 transition-all group flex items-center justify-between">
                                    <div><p class="font-black uppercase text-xs tracking-widest text-slate-800">Branded Advisory Report</p><p class="text-[9px] sm:text-[10px] font-bold text-slate-500 mt-1">Plain English homeowner audit.</p></div>
                                    <i class="fas fa-chevron-right text-slate-300 group-hover:text-blue-400"></i>
                                </button>
                                
                                <button onclick="handleBuybackExport()" class="w-full text-left p-5 sm:p-6 border-2 border-amber-50 bg-amber-50/30 rounded-2xl hover:bg-amber-100 hover:border-amber-300 transition-all group flex items-center justify-between">
                                    <div><p class="font-black uppercase text-xs tracking-widest text-amber-800">Export to Investor Buyback</p><p class="text-[9px] sm:text-[10px] font-bold text-amber-600 mt-1">Run deal pro-forma in standalone calculator.</p></div>
                                    <i class="fas fa-external-link-alt text-amber-300 group-hover:text-amber-500"></i>
                                </button>
                            </div>
                        </div>
                    </dialog>
                </div>`;
        };

        // --- INITIALIZATION ---
        let app, db, auth;
        const init = async () => {
            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                if (typeof __initial_auth_token !== 'undefined') await signInWithCustomToken(auth, __initial_auth_token); 
                else await signInAnonymously(auth); 
                window.calculate();
                window.render();
            } catch (err) {
                console.error("Initialization Failed:", err);
                window.calculate();
                window.render();
            }
        };
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
