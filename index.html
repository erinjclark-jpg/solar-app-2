<!-- 
================================================================================
PROJECT CONTEXT: SolarCheck Professional
Current Version: v7.61
Date: February 2026
Architecture: Single-File HTML5 Web Application (Vanilla JS + Tailwind CSS)
================================================================================

1. OVERVIEW
   "SolarCheck Professional" is a specialized calculator and reporting tool designed for real estate 
   field inspectors and solar consultants. It evaluates residential solar systems by calculating 
   performance efficiency, analyzing financial contracts (Leases/PPAs), and determining Fair Market 
   Value (FMV).

2. CRITICAL DEPLOYMENT CONSTRAINTS
   * Single-File Mandate: All HTML, CSS, and JS must remain in this one file. No external local files.
   * Hosting: Github (static).
   * Image Assets: The tool requires specific local images in the same root directory:
     - 'thumbnail_RSR LOGO.png' (Rocklin Solar Repair)
     - 'Shine on Logo.png' (Shine On Solar)
     - 'ssoc_logo.png' (Solar Service of Colorado)
   * Printing: Uses custom window.openPrintableWindow() to handle iframe restrictions. DO NOT DELETE.

3. CORE LOGIC ENGINES
   A. The "Bucket Model" (Battery):
      - Calculates usable capacity = Total kWh * (1 - Reserve %).
      - Adds an efficiency boost to the Self-Consumption Rate (SCR) based on battery size vs daily gen.
      - Hard capped at 98% SCR.
   B. TPO Payment Splitting:
      - Sums Solar Rate ($/kWh) and Battery Fixed Fee ($/mo) for total monthly payment logic.
   C. Valuation (Income vs Cost):
      - Income: DCF of future savings (Retail vs Export rates).
      - TPO Strategy: Splits Income Value into "Contract Term" (Years 0-End) and "Residual" (Years End+).
      - Headline FMV for TPO defaults to Contract Term Value only (negotiation anchor).
      - Cost: Replacement cost ($/Watt) minus depreciation.
   D. Branding:
      - Multi-company toggle in inputs (RSR, Shine On, SSOC).
      - Saves selection to localStorage.

4. REPORTING SYSTEM
   - Solar Asset Report: Educational, for homeowners. Visual health bars.
   - Appraisal/FMV Report: Professional, for lenders/agents. USPAP-style.
   - Strategic Leverage Analysis:
     - Ceiling: Compares FMV vs Remaining Lease Payments (Don't pay more than you owe).
     - Floor: Calculates TPO Removal Liability ($175/panel) as negotiation leverage.

5. VISUAL STANDARDS
   - Timelines: Panels (25y), String Inverter (12y), Microinverter (25y), Battery (10y).
   - Typography: Large fonts for readability.

6. AI SESSION PROTOCOL (MANDATORY)
   1. DO NOT REWRITE FROM SCRATCH. Always modify this existing file.
   2. VERSION CONTROL: You MUST increment the version number in the <title> tag 
      and the visual header (e.g. v7.50 -> v7.51) with EVERY code change.
   3. PRESERVE LOGIC: Do not simplify the complex math in the calculate() function.

================================================================================
-->

        // --- 4. Core Logic (Calculation) ---
        function calculate() {
            const { pC, pW, iDt, pDt, or, sh, pi, ac, b, br, scr, it, ut, rU, eU, tE, tG, tEs, pa, paB, tR, rR, rC, ne, c, l, om, dr, rp, tx, e, w, te, o, srec, srecP } = window.state;
            const s = (pC * pW) / 1000; window.state.sz = s;
            const iT = +new Date(iDt), pT = +new Date(pDt);
            const age = (iT && pT && pT > iT) ? (pT - iT) / (1000 * 60 * 60 * 24 * 365.25) : 0;
            const YF = { south: 1550, mix: 1500, east_west: 1450, north: 1200 }[or] * { none: 1, some: 0.85, alot: 0.7 }[sh] * { standard: 1, flat: 0.89, steep: 0.96 }[pi];
            const th = s * YF; const aK = ac * 1000; const dA = 1 - ((age / 2) * 0.005); const eL = th * age * dA; const pr = eL > 0 ? aK / eL : 0;

            if (window.state.aC) {
                let nC = pr; if (!isFinite(nC)) nC = 1; nC = Math.min(1.0, Math.max(0, nC));
                if (Math.abs(nC - c) > 0.005) { window.state.c = parseFloat(nC.toFixed(2)); }
            }

            const sR = scr / 100;
            const retailRate = rU || 0.35;
            const exportRate = eU || 0.05;

            const cP = th * (1 - (age * 0.005)); 
            // UPDATED v7.34: Added 'ne' (NEM Policy Factor) to the export portion of the blended rate
            const bR = (sR * retailRate) + ((1 - sR) * exportRate * ne);
            
            const pS = (cP * bR); 
            const aS = pS * pr; const loss = pS - aS; const eN = cP * pr; const eD = eN / 365;

            let tEt = 0, tGt = 0; const fY = Math.floor(age);
            for (let i = 0; i < fY; i++) { const d = 1 - (i * 0.005); tEt += tE * d; tGt += tG * d; }
            const par = age - fY; const pDm = 1 - (fY * 0.005); tEt += tE * pDm * par; tGt += tG * pDm * par;
            const gD = (aK / 1000) - (tGt / 1000); const nYg = tG * (1 - (Math.floor(age) * 0.005)); const nYV = (eN / 1000) - (nYg / 1000);

            let tCt = 0, aP = pa * 12;
            for (let i = 0; i < te; i++) { tCt += aP; aP *= (1 + (tEs / 100)); }

            // UPDATED v7.56: Calculate REMAINING payment obligation correctly
            let remCost = 0;
            let payCursor = pa * 12; 
            for(let i=0; i<te; i++) {
                if(i >= age) {
                    remCost += payCursor;
                } else if (i === Math.floor(age)) {
                    // Partial year remaining
                    let portion = 1 - (age - Math.floor(age));
                    remCost += payCursor * portion;
                }
                payCursor *= (1 + (tEs/100));
            }

            let fTe = 0, fTg = 0; const term = parseFloat(te) || 20; const year1Est = parseFloat(tE) || 0; const year1Guar = parseFloat(tG) || 0;
            for(let i=0; i<term; i++){ const d = 1 - (i * 0.005); fTe += year1Est * d; fTg += year1Guar * d; }

            const aE = e / 100; 
            const pastAvgRate = bR / Math.pow(1 + aE, age / 2); const pSav = aK * pastAvgRate; 
            let fSa = 0; const calcTerm = (o === 'owned') ? 25 : (te || 20); const rM = Math.max(0, calcTerm - age); const yearsToCalc = Math.ceil(rM);

            for (let i = 0; i < yearsToCalc; i++) {
                const degFactor = Math.max(0, 1 - ((age + i) * 0.005)); const yearlyProd = th * degFactor * pr;
                const yearlyRate = bR * Math.pow(1 + aE, i);
                let fraction = 1; if (i === yearsToCalc - 1) { fraction = rM - Math.floor(rM); if (fraction === 0 && rM > 0) fraction = 1; }
                fSa += yearlyProd * yearlyRate * fraction;
            }
            const tS = pSav + fSa;
            const iC = Math.floor(age); const iL = te - 1;
            const pYC = pa * Math.pow(1 + (tEs / 100), iC); const rYC = (tE * (1 - (iC * 0.005))) > 0 ? (pYC * 12) / (tE * (1 - (iC * 0.005))) : 0;
            const pYL = pa * Math.pow(1 + (tEs / 100), iL); const rYL = (tE * (1 - (iL * 0.005))) > 0 ? (pYL * 12) / (tE * (1 - (iL * 0.005))) : 0;

            const paS = Math.max(0, pa - (paB || 0)); 
            
            const usableBat = Math.max(0, b * (1 - (br / 100)));
            const batBoost = scr - 60; 

            window.state.r = {
                age, sz: s, act: ac, estL: tEt / 1000, guaL: tGt / 1000, pr, gDiff: gD, potSav: pS, actSav: aS, loss, curProd: cP, estN12: eN, estDay: eD,
                nYG: nYg, nYV, tCost: tCt, remCost: remCost, futSav: fSa, totSav: tS, pY1: pa, rY1: tE > 0 ? (paS * 12) / tE : 0, pYC, rYC, pYL, rYL, fTe, fTg,
                estLifeKwh: tEt / 1000, estLifeMwh: tEt / 1000, guarLifeMwh: tGt / 1000, physLifeMwh: eL / 1000, paB, paS,

            };

            const sC = s * 1000 * rC; const bR2 = b * 1000; const rL = Math.max(0, l - age);

            let dcf = 0;

        function generateStandardReport(type, inputs) {

        // v7.35 New Footer Helper (Updated v7.48 for Dynamic Branding)
        function getReportFooter(isFMV = false) {
            const comp = COMPANIES[window.state.company] || COMPANIES['rsr'];
            const disclaimer = isFMV ? `<p class="mb-2 italic text-sm">This report adheres to standard appraisal practices for distributed energy resources. It assumes the system is free of liens and encumbrances upon transfer.</p>` : '';

                <div class="text-center text-xs text-slate-500 mt-8 max-w-2xl mx-auto">

                </div>
            </div>`;
        }

        // v7.32: Expanded & Robust FMV Report (Dual Audience: Homeowner + TPO)
        function generateFMVReport(inputs) {
            const { systemSize, age, fairMarketValue, address, performanceRatio, condition, repairs, r, aR, installDate, utilityRate, dr, battery, inverterType, rU, eU, l, rC, om, scr, panelCount, panelWatts, o, contractTerm } = inputs;
            const date = new Date().toLocaleDateString();
            const comp = COMPANIES[window.state.company] || COMPANIES['rsr'];
            
            // --- Helper Styles ---
            const sectionHeader = (title, icon) => `<div class="break-inside-avoid mt-8 mb-4 border-b-2 border-slate-800 pb-2 flex items-center gap-2"><i class="fas fa-${icon} text-slate-800"></i><h3 class="text-xl font-bold uppercase tracking-wide text-slate-900">${title}</h3></div>`;
            const box = (content, bg="bg-slate-50", border="border-slate-200") => `<div class="${bg} p-5 rounded-lg border ${border} mb-4 break-inside-avoid shadow-sm">${content}</div>`;
            const note = (title, text) => `<div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-4 text-base text-blue-900 break-inside-avoid"><p class="font-bold text-sm uppercase mb-1 text-blue-700"><i class="fas fa-info-circle mr-1"></i> Analyst Note (Plain English)</p><p>${text}</p></div>`;
            
            // --- HEADER ---
            let header = `
            <div class="font-sans text-slate-800">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <img src="${comp.logo}" class="h-12 object-contain" onerror="this.style.display='none'"/>
                    <div class="text-right text-xs text-slate-500">
                        <p class="font-bold uppercase">${comp.name}</p>
                        <p>${comp.phone}</p>
                    </div>
                </div>
                <div class="mb-8 pb-4 border-b-4 border-slate-900">
                    <div class="flex justify-between items-end">
                        <div>
                            <h1 class="text-5xl font-black text-slate-900 uppercase tracking-tight mb-1">Fair Market Value</h1>
                            <p class="text-base font-bold uppercase tracking-widest text-slate-600">Solar Asset Appraisal & Buyout Negotiation Report</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-slate-900 text-xl">${address || "Solar Property"}</p>
                            <p class="text-base text-slate-600">Effective Date: ${date}</p>
                        </div>
                    </div>
                </div>`;
            
            let body = `<div class="text-slate-800 text-base leading-relaxed">`;

            // UPDATED v7.58: Dynamic "Age / Remaining Contract" Label
            const isTPO = (o === 'lease' || o === 'ppa');
            const remLabel = isTPO ? "Remaining Contract" : "Remaining Life";
            const remValue = isTPO ? Math.max(0, contractTerm - age) : Math.max(0, l - age);

            // --- 1. EXECUTIVE SUMMARY ---
            body += `<div class="bg-slate-900 text-white p-8 rounded-xl shadow-lg mb-8 break-inside-avoid"><div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center"><div><p class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-2">Conclusion of Fair Market Value (FMV)</p><p class="text-6xl font-black text-white mb-2">${cur(fairMarketValue)}</p><p class="text-sm text-slate-300">Valuation based on ${window.state.w === 100 ? 'Income Capitalization Approach (Standard)' : 'Cost Approach (Depreciated)'}.</p></div><div class="bg-slate-800 p-5 rounded-lg border border-slate-700 text-base space-y-3"><div class="flex justify-between border-b border-slate-700 pb-2"><span>System Size</span><span class="font-bold text-blue-300">${systemSize.toFixed(2)} kW DC</span></div><div class="flex justify-between border-b border-slate-700 pb-2"><span>Age / ${remLabel}</span><span class="font-bold text-blue-300">${age.toFixed(1)} / ${remValue.toFixed(1)} Years</span></div><div class="flex justify-between border-b border-slate-700 pb-2"><span>Condition Factor</span><span class="font-bold text-blue-300">${(condition * 100).toFixed(0)}%</span></div><div class="flex justify-between text-yellow-400 font-bold pt-1"><span>Buyout Ceiling Suggestion</span><span>${cur(fairMarketValue * 1.05)}</span></div></div></div></div>`;
            
            body += note("Understanding This Number", "This valuation represents the true market worth of the solar system as it sits on the roof today. It is <strong>not</strong> the sum of remaining lease payments, nor the original price. It is what a knowledgeable buyer would pay for the future energy savings this specific used equipment will generate.");

            // --- 2. SYSTEM IDENTIFICATION & CONDITION ---
            body += sectionHeader("System Identification & Condition", "search-location");
            body += `<div class="grid grid-cols-2 gap-6 mb-6">
                ${box(`<h4 class="font-bold text-slate-900 mb-3 text-lg">Physical Hardware</h4><ul class="space-y-2 text-base"><li><strong>Generator:</strong> ${systemSize.toFixed(2)} kW PV Array</li><li><strong>Modules:</strong> ${panelCount} x ${panelWatts} Watts</li><li><strong>Inverter:</strong> ${inverterType === 'micro' ? 'Microinverters (Distributed)' : 'String Inverter (Central)'}</li><li><strong>Battery:</strong> ${battery > 0 ? `${battery} kWh Storage` : 'None'}</li><li><strong>Install Date:</strong> ${installDate}</li></ul>`)}
                ${box(`<h4 class="font-bold text-slate-900 mb-3 text-lg">Performance Analysis</h4><ul class="space-y-2 text-base"><li><strong>Actual Lifetime Output:</strong> ${num(r.act)} MWh</li><li><strong>Performance Ratio (PR):</strong> ${(r.pr * 100).toFixed(1)}% (Target >90%)</li><li class="border-t pt-2 mt-2"><strong>Vs. Contract Estimate:</strong> <span class="${r.act >= r.estLifeMwh ? 'text-green-600' : 'text-orange-600'} font-bold">${(r.act / r.estLifeMwh * 100).toFixed(1)}%</span> of ${num(r.estLifeMwh)} MWh</li>${r.guaL > 0 ? `<li><strong>Vs. Guaranteed Min:</strong> <span class="${r.act >= r.guaL ? 'text-green-600' : 'text-red-600'} font-bold">${(r.act / r.guaL * 100).toFixed(1)}%</span> of ${num(r.guaL)} MWh</li>` : ''}<li class="border-t pt-2 mt-2"><strong>Observed Degradation:</strong> ${((1-condition)*100).toFixed(1)}%</li><li><strong>Est. Repairs Needed:</strong> <span class="text-red-600 font-bold">${cur(repairs)}</span></li></ul>`)}
            </div>`;
            
            // --- 3. VALUATION METHODOLOGY 1: INCOME APPROACH ---
            if (window.state.w === 100) {
                body += sectionHeader("Methodology: Income Approach (DCF)", "chart-line");
                body += `<p class="mb-4">The Income Capitalization Approach is the primary method for valuing income-generating assets. It projects the future financial benefits (avoided utility costs) and discounts them to a present value using a risk-adjusted rate.</p>`;
                
                body += `<div class="overflow-x-auto mb-4 border rounded-lg border-slate-200">
                    <table class="w-full text-base text-left">
                        <thead class="bg-slate-100 text-slate-800 font-bold"><tr><th class="p-4">Variable</th><th class="p-4">Input Value</th><th class="p-4">Rationale / Source</th></tr></thead>
                        <tbody class="divide-y divide-slate-100">
                            <tr><td class="p-4 font-medium">Year 1 Projected Revenue</td><td class="p-4 font-bold text-green-700">${cur(aR.yD[0]?.c * (1 + dr/100) || 0)}</td><td class="p-4 text-sm text-slate-600">Based on ${num(r.estN12)} kWh/yr production @ $${rU}/kWh (Blended).</td></tr>
                            <tr><td class="p-4 font-medium">Utility Escalation</td><td class="p-4">${window.state.e}%</td><td class="p-4 text-sm text-slate-600">Historial average utility rate increase.</td></tr>
                            <tr><td class="p-4 font-medium">Discount Rate (Risk)</td><td class="p-4">${dr}%</td><td class="p-4 text-sm text-slate-600">Reflects risk of hardware failure, policy changes (NEM), and illiquidity.</td></tr>
                            <tr><td class="p-4 font-medium">OpEx (O&M)</td><td class="p-4">$${om}/kW/yr</td><td class="p-4 text-sm text-slate-600">Estimated maintenance, cleaning, and insurance costs.</td></tr>
                        </tbody>
                    </table>
                </div>`;
                
                // UPDATED v7.56: Split Income Logic
                if (o !== 'owned') {
                    body += `<div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="bg-blue-50 p-4 rounded border border-blue-200 text-center">
                            <p class="text-xs font-bold text-blue-800 uppercase">Contract Term Value</p>
                            <p class="text-2xl font-black text-blue-700">${cur(aR.incContract)}</p>
                            <p class="text-[10px] text-blue-600">Present Value (Years 0-${inputs.contractTerm})</p>
                        </div>
                        <div class="bg-purple-50 p-4 rounded border border-purple-200 text-center">
                            <p class="text-xs font-bold text-purple-800 uppercase">Residual Speculative Value</p>
                            <p class="text-2xl font-black text-purple-700">${cur(aR.incResidual)}</p>
                            <p class="text-[10px] text-purple-600">Present Value (Years ${parseInt(inputs.contractTerm)+1}+)</p>
                        </div>
                    </div>`;
                }

                body += `<div class="flex justify-between items-center bg-green-50 p-5 rounded-lg border border-green-200 mb-4"><span class="font-bold text-green-900 uppercase text-lg">Total Income Approach Value</span><span class="text-3xl font-black text-green-700">${cur(aR.inc)}</span></div>`;
                body += note("Why this matters", `This calculation treats your solar system like a small business. The TPO often values the system based on 30 years of revenue (Total Value). However, their contract typically only guarantees revenue for 20 years (Contract Term Value). The 'Residual Value' is speculative and should be heavily discounted in negotiations.`);
            }

            // --- 4. VALUATION METHODOLOGY 2: COST APPROACH ---
            if (window.state.w === 0) {
                body += sectionHeader("Methodology: Cost Approach (Depreciated)", "hammer");
                body += `<p class="mb-4">The Cost Approach estimates the value based on the cost to replace the utility of the asset with a modern equivalent, less depreciation for physical wear and functional obsolescence.</p>`;
                
                const replacementCost = systemSize * 1000 * rC;
                const depAmount = replacementCost - aR.cost; // Approximate
                
                body += `<div class="grid grid-cols-3 gap-6 mb-6 text-center">
                    <div class="bg-slate-50 p-4 rounded border">
                        <p class="text-sm font-bold text-slate-500 uppercase">Replacement Cost</p>
                        <p class="text-xl font-bold text-slate-800">${cur(replacementCost)}</p>
                        <p class="text-xs text-slate-500">@ $${rC.toFixed(2)}/Watt (Current Market)</p>
                    </div>
                    <div class="bg-red-50 p-4 rounded border border-red-100">
                        <p class="text-sm font-bold text-red-500 uppercase">Total Depreciation</p>
                        <p class="text-xl font-bold text-red-700">-${cur(replacementCost - aR.cost)}</p>
                        <p class="text-[10px] text-red-400">${((1 - (aR.cost/replacementCost))*100).toFixed(1)}% (Age + Obsolescence)</p>
                    </div>
                    <div class="bg-blue-50 p-4 rounded border border-blue-100">
                        <p class="text-sm font-bold text-blue-500 uppercase">Cost Approach Value</p>
                        <p class="text-xl font-bold text-blue-700">${cur(aR.cost)}</p>
                        <p class="text-xs text-blue-500">Current Physical Value</p>
                    </div>
                </div>`;
                
                body += note("The 'Used Car' Logic", "Solar panels get cheaper and more efficient every year. A system bought 5 years ago is like a 5-year-old laptop. We calculate value based on what it costs to buy a <strong>new, better</strong> system today, then subtract value for the years yours has already been used.");
            }

            // --- 5. TPO BUYOUT CONTEXT ---
            // UPDATED v7.56: Added Strategic Leverage Analysis
            // UPDATED v7.58: Dynamic Removal Cost at $175/panel
            body += sectionHeader("Strategic Leverage Analysis", "chess-queen");
            
            if (o === 'lease' || o === 'ppa') {
                const remCost = r.remCost || 0;
                const removalLiability = (panelCount || 0) * 175;
                const ceilingAlert = fairMarketValue > remCost;
                
                body += `<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div class="bg-slate-50 p-5 rounded-lg border border-slate-200">
                        <h4 class="font-bold text-slate-700 uppercase text-xs mb-2">The Ceiling (Max Price)</h4>
                        <p class="text-3xl font-black text-slate-800 mb-1">${cur(remCost)}</p>
                        <p class="text-sm text-slate-500 mb-3">Total Remaining Payments</p>
                        ${ceilingAlert ? `<div class="bg-red-100 text-red-800 p-2 rounded text-xs font-bold"><i class="fas fa-triangle-exclamation mr-1"></i> ALERT: FMV exceeds remaining payments. Do NOT buyout.</div>` : `<div class="bg-green-100 text-green-800 p-2 rounded text-xs font-bold"><i class="fas fa-check mr-1"></i> FMV is lower than remaining payments. Buyout may be favorable.</div>`}
                    </div>
                    <div class="bg-slate-50 p-5 rounded-lg border border-slate-200">
                        <h4 class="font-bold text-slate-700 uppercase text-xs mb-2">The Floor (TPO Liability)</h4>
                        <p class="text-3xl font-black text-red-600 mb-1">-$${num(removalLiability)}</p>
                        <p class="text-sm text-slate-500 mb-3">Est. Cost to Remove System (${panelCount} x $175)</p>
                        <p class="text-xs text-slate-600 leading-tight">At the end of the term, the TPO must pay this amount to remove the system. This liability gives you leverage to negotiate a low (or zero) cost transfer of title.</p>
                    </div>
                </div>`;
            }

            body += `<div class="bg-yellow-50 p-6 rounded-lg border border-yellow-200 mb-6">
                <h4 class="font-bold text-yellow-900 mb-3 uppercase text-sm tracking-wider">Market Reality vs. Contract Price</h4>
                <ul class="list-disc pl-5 space-y-2 text-yellow-900 text-base">
                    <li><strong>Technological Obsolescence:</strong> New panels are ~20% more efficient than panels from ${new Date(installDate).getFullYear()}. The subject system's value is capped by the falling cost of new technology.</li>
                    <li><strong>Inverter Risk:</strong> As a ${inverterType} system approaching year ${age.toFixed(0)}, there is a statistical probability of component failure in the next 3-5 years. The FMV includes a risk adjustment for this expense ($${cur(2000)} est), which TPO book values often ignore.</li>
                    <li><strong>Investment Tax Credit (ITC):</strong> The original tax credit was claimed by the TPO. The FMV assumes no new tax incentives are available for used equipment, further separating it from 'new' retail pricing.</li>
                </ul>
            </div>`;

            // --- 6. FINAL RECONCILIATION ---
            body += sectionHeader("Conclusion of Value", "scale-balanced");
            body += `<div class="bg-slate-50 border border-slate-200 rounded-lg p-8 text-center">
                <p class="text-base font-bold text-slate-500 uppercase tracking-widest mb-3">Final Opinion of Fair Market Value</p>
                <p class="text-6xl font-black text-slate-900 mb-3">${cur(fairMarketValue)}</p>
                <p class="text-base text-slate-600">Effective Date: ${date}</p>
                <p class="text-sm text-slate-500 mt-4 max-w-lg mx-auto">This opinion is based on the ${window.state.w === 100 ? 'Income Capitalization Approach' : 'Cost Approach'}, considered the most reliable method for this specific asset type and market condition.</p>
            </div>`;
            
            return header + body + `</div>` + getReportFooter(true);
        }

        // --- UI Component Helpers ---
        function I(l, v, key, t = "number", d, st = "0.01", disabled = false, handler = "handleInputChange") { return `<div class=""><label for="${key}" class="block text-slate-700 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><input type="${t}" step="${st}" id="${key}" class="w-full p-2 border border-slate-300 rounded text-slate-800 text-lg font-semibold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow ${disabled ? 'bg-slate-100 text-slate-500' : 'bg-white'}" value="${v}" ${disabled ? 'disabled' : ''} onchange="${handler}(event,'${key}')"/><p class="text-sm text-slate-500 mt-1 leading-snug">${d || ''}</p></div>`; }
        function Idark(l, v, key, t = "number", d, st = "0.01", disabled = false) { return `<div class=""><label for="${key}" class="block text-blue-200 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><input type="${t}" step="${st}" id="${key}" class="w-full p-2 border border-slate-500 rounded bg-slate-700/50 text-white text-lg font-semibold focus:ring-2 focus:ring-blue-400 focus:border-blue-400 placeholder-slate-400 backdrop-blur-sm ${disabled ? 'opacity-50 cursor-not-allowed' : ''}" value="${v}" ${disabled ? 'disabled' : ''} onchange="handleInputChange(event,'${key}')"/><p class="text-sm text-slate-400 mt-1 leading-snug">${d || ''}</p></div>`; }
        function Sdark(l, v, key, o, d) { return `<div class=""><label for="${key}" class="block text-blue-200 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><select id="${key}" class="w-full p-2 border border-slate-500 rounded bg-slate-700/50 text-white text-lg font-semibold focus:ring-2 focus:ring-blue-400 focus:border-blue-400 backdrop-blur-sm" onchange="handleInputChange(event,'${key}')">${o.map(x => `<option value="${x.v}" ${v == x.v ? 'selected' : ''}>${x.l}</option>`).join('')}</select><p class="text-sm text-slate-400 mt-1 leading-snug">${d || ''}</p></div>`; }
        function S(l, v, key, o, d, handler = "handleInputChange") { return `<div class=""><label for="${key}" class="block text-slate-700 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><select id="${key}" class="w-full p-2 border border-slate-300 rounded text-slate-800 text-lg font-semibold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white" onchange="${handler}(event,'${key}')">${o.map(x => `<option value="${x.v}" ${v == x.v ? 'selected' : ''}>${x.l}</option>`).join('')}</select><p class="text-sm text-slate-500 mt-1 leading-snug">${d || ''}</p></div>`; }
        function R(l, v, s, d) { return `<div class="mb-4 border-b border-slate-100 pb-3 last:border-0 last:pb-0"><div class="flex justify-between items-center text-base sm:text-lg"><span class="font-bold text-slate-700">${l}</span><span class="font-bold text-slate-900 text-lg sm:text-xl">${v} <span class="text-sm sm:text-base text-slate-600 font-normal">${s}</span></span></div>${d ? `<p class="text-sm text-slate-600 leading-tight mt-1 font-medium">${d}</p>` : ''}</div>`; }
        function C(t, d, children, c = 'text-slate-800', cl = '', icon = '', wrapperCl = '') {
            let iconHtml = '';
            if (t.includes("Profile")) iconHtml = '<i class="fas fa-solar-panel mr-2 text-blue-600"></i>';
            if (t.includes("Performance")) iconHtml = '<i class="fas fa-chart-line mr-2 text-green-600"></i>';
            if (t.includes("Economics") || t.includes("Savings")) iconHtml = '<i class="fas fa-sack-dollar mr-2 text-emerald-700"></i>';
            if (t.includes("Warranty")) iconHtml = '<i class="fas fa-shield-halved mr-2 text-indigo-600"></i>';
            if (t.includes("Cost Approach")) iconHtml = '<i class="fas fa-hammer mr-2 text-slate-500"></i>';
            if (t.includes("Income Approach")) iconHtml = '<i class="fas fa-money-bill-trend-up mr-2 text-green-500"></i>';
            if (t.includes("Battery")) iconHtml = '<i class="fas fa-battery-full mr-2 text-green-700"></i>';
            if (t.includes("Contract")) iconHtml = '<i class="fas fa-file-contract mr-2 text-slate-700"></i>';
            
            return `<div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow duration-300 h-full break-inside-avoid ${cl} ${wrapperCl}"><div class="border-b border-slate-100 pb-4 mb-5"><h3 class="text-2xl font-bold flex items-center ${c}">${iconHtml}${t}</h3>${d ? `<p class="text-base text-slate-600 mt-1 font-medium">${d}</p>` : ''}</div>${children}</div>`;
        }

        function render() {
            const { activeTab, activeModal, o, sz, r, aR, a, iDt, pDt, ac, pC, pW, b, br, scr, it, ut, rU, eU, or, pi, sh, tE, tG, tEs, pa, paB, tR, rR, rC, ne, c, l, om, dr, rp, tx, e, w, te, reportTitle, srec, srecP, company } = window.state;
            const root = document.getElementById('root');
            let leaseAssessment = "";
            if (r) {
                 const isGuaranteed = r.guaL > 0, act = r.act, est = r.estLifeMwh, gua = r.guaL;

System Performing Optimally</strong><br/><span class="opacity-90">Actual output meets or exceeds expectations.</span></div>`}</div><div class="p-3 border-t mt-3 text-sm text-slate-500 text-center font-medium">Based on Retail $${window.state.rU.toFixed(2)} / Buyback $${window.state.eU.toFixed(2)}</div>`, 'text-green-800', '💰') : C("Est. Utility Savings", "Calculates the financial value of the solar energy produced, comparing current monthly averages to total lifetime savings.", `<div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6 border-b pb-6"><div><p class="text-sm font-bold text-slate-500">Future Savings</p><p class="text-2xl font-black text-slate-800">${cur(r.futSav)}</p><p class="text-sm text-slate-500 font-medium">Value of energy offset</p></div><div><p class="text-sm font-bold text-slate-500">Total Lifetime</p><p class="text-2xl font-black text-slate-800">${cur(r.totSav)}</p><p class="text-sm text-slate-500 font-medium">${te}-year contract savings</p></div></div><div class="space-y-3 border-b pb-6 mb-3"><div class="flex justify-between"><span class="font-bold text-base text-slate-700">Current Year Annual</span><span class="font-bold text-xl text-green-700">${cur(r.actSav)}</span></div><p class="text-sm text-slate-500 text-right -mt-2 mb-3 font-medium">This year's benefit</p><div class="flex justify-between"><span class="font-bold text-base text-slate-700">Current Monthly Avg</span><span class="font-bold text-xl text-slate-800">${cur(r.actSav / 12)}</span></div><p class="text-sm text-slate-500 text-right -mt-2 font-medium">Avg monthly bill offset</p></div><div class="pt-3">${(r.loss > 0 && (o === 'owned' || r.act < r.estLifeMwh)) ? `<div class="flex justify-between items-baseline"><span class="text-sm font-bold text-slate-500 uppercase">Potential Annual Value</span><span class="font-bold text-lg text-green-600">${cur(r.potSav)}</span></div><div class="mt-3 bg-red-50 text-red-900 p-3 rounded text-sm text-center border border-red-200 font-medium"><strong>Est. Annual Loss: -${cur(r.loss)}</strong><br/><span class="opacity-90">Value lost due to underperformance. May support a performance claim.</span></div>` : `<div class="mt-3 bg-green-50 text-green-900 p-3 rounded text-sm text-center border border-green-200 font-medium"><strong><i class="fas fa-check-circle mr-1"></i> System Performing Optimally</strong><br/><span class="opacity-90">Actual output meets or exceeds expectations.</span></div>`}</div><div class="p-3 border-t mt-3 text-sm text-slate-500 text-center font-medium">Based on Retail $${window.state.rU.toFixed(2)} / Buyback $${window.state.eU.toFixed(2)}</div>`, 'text-green-800', '💰')}
                        ${warrantyHtml}
                        ${tpoHtml}
                    </div>` : ''}

                    ${activeTab === 'valuation' && aR ? `
                    <div class="tab-content space-y-6">
                        <div class="bg-slate-800 text-white p-5 rounded-xl shadow relative overflow-hidden"><div class="relative z-10 text-center"><p class="text-xs font-bold text-blue-300 uppercase tracking-widest mb-1">Fair Market Value</p><p class="text-4xl font-extrabold mb-1">${cur(aR.val + aR.tr)}</p><p class="text-xs text-slate-400">${w === 100 ? 'Income Approach' : w === 0 ? 'Cost Approach' : `Blended (${w}% Income)`}</p></div></div>
                        <div class="bg-slate-700 p-4 rounded-xl border border-slate-600">
                             <h4 class="text-xs font-bold text-white uppercase mb-3 border-b border-slate-600 pb-2">Adjustments</h4>
                             <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                 ${Idark("Discount Rate (%)", dr, "dr", "number", "Risk-adjusted discount rate for future cash flows.")}
                                 ${Idark("Utility Escalation (%)", e, "e", "number", "Estimated annual increase in utility electricity rates.")}
                                 ${Idark("Est. Repairs ($)", rp, "rp", "number", "Estimated cost to repair or replace broken components.", "100")}
                                 ${Idark("Replacement Cost ($/W)", rC, "rC", "number", "Current market cost to install a new system ($/Watt).", "0.1")}
                                 ${Idark("Useful Life (Years)", l, "l", "number", "Total operational life. Industry Std: 25-30y. (Note: TPOs often claim 35y to inflate value).")}
                                 ${Sdark("Export / NEM Policy", ne, "ne", [{v:1.0, l:"Full Retail Credit (NEM 1.0/2.0)"}, {v:0.8, l:"High Export Rate ($0.15+)"}, {v:0.5, l:"Reduced Rate (NEM 3.0)"}, {v:0.2, l:"Wholesale Rate (<$0.05)"}, {v:0.0, l:"No Export Credit"}], "How the utility credits surplus energy.")}
                                 ${Idark("Condition (0-1)", c, "c", "number", window.state.aC ? "Auto-calculated based on production." : "Manual condition factor (0.0 - 1.0).", "0.1", window.state.aC)}
                                 <div class="col-span-1 sm:col-span-2 pt-2 border-t border-slate-600 mt-2"><div class="flex justify-between items-center mb-2"><label class="text-blue-200 text-xs font-bold uppercase">Include SRECs / Incentives?</label><button onclick="updateState('srec', ${!srec})" class="w-10 h-5 rounded-full transition-colors ${srec ? 'bg-green-500' : 'bg-slate-600'} relative"><div class="w-3 h-3 bg-white rounded-full absolute top-1 transition-all ${srec ? 'left-6' : 'left-1'}"></div></button></div>${srec ? Idark("SREC Market Value ($/MWh)", srecP, "srecP", "number", "Estimated value of Renewable Energy Credits per MWh.") : ''}</div>
                                 <div class="col-span-1 sm:col-span-2 pt-2 border-t border-slate-600 mt-2"><label class="block text-blue-200 text-xs font-bold uppercase mb-2">Valuation Methodology</label><div class="flex bg-slate-800 p-1 rounded-lg border border-slate-600"><button onclick="updateState('w', 100)" class="flex-1 py-2 rounded-md text-xs font-bold transition-all ${w === 100 ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}">Income Approach (Standard)</button><button onclick="updateState('w', 0)" class="flex-1 py-2 rounded-md text-xs font-bold transition-all ${w === 0 ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}">Cost Approach</button></div><p class="text-[10px] text-slate-400 mt-2 text-center">${w === 100 ? "Calculates value based on future energy savings (Standard for TPO)." : "Calculates value based on equipment replacement cost less depreciation."}</p></div>
                             </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${C("Cost Basis", "", `<p class="text-xl font-bold text-slate-700">${cur(aR.cost)}</p><p class="text-xs text-slate-400">Depreciated Replacement</p>`, 'text-slate-700')}${C("Income Basis", "", `<p class="text-xl font-bold text-green-700">${cur(aR.inc)}</p><p class="text-xs text-slate-400">Discounted Cash Flow ${srec ? '(w/ SRECs)' : ''}</p>`, 'text-green-700')}</div>
                    </div>` : ''}
                </div>
                <dialog id="print-modal" class="modal p-0 rounded-lg shadow-2xl backdrop:bg-slate-900/50">
                    <div class="bg-white p-6 w-80 rounded-xl relative">
                        <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
                        <h3 class="font-bold mb-4 text-slate-800">Select Report</h3>
                        <div class="space-y-2"><button onclick="handleGenerateReport('owned')" class="w-full text-left p-3 border rounded hover:bg-slate-50 text-sm font-bold text-slate-700"><i class="fas fa-house-chimney text-blue-500 mr-2"></i> Owned System</button>${o === 'lease' ? `<button onclick="handleGenerateReport('lease')" class="w-full text-left p-3 border rounded hover:bg-slate-50 text-sm font-bold text-slate-700"><i class="fas fa-file-signature text-purple-500 mr-2"></i> Lease Assumption</button>` : ''}${o === 'ppa' ? `<button onclick="handleGenerateReport('ppa')" class="w-full text-left p-3 border rounded hover:bg-slate-50 text-sm font-bold text-slate-700"><i class="fas fa-bolt text-yellow-500 mr-2"></i> PPA Transfer</button>` : ''}<button onclick="handleGenerateReport('val')" class="w-full text-left p-3 border rounded hover:bg-slate-50 text-sm font-bold text-slate-700"><i class="fas fa-scale-balanced text-emerald-500 mr-2"></i> Valuation / FMV</button></div>
                    </div>
                </dialog>
            </div>`;
            root.innerHTML = html;
            if (activeModal) { const modal = document.getElementById(activeModal); if (modal && !modal.open) modal.showModal(); }
        }

        window.calculate = calculate; window.render = render; window.handleGenerateReport = handleGenerateReport; window.openModal = openModal; window.closeModal = closeModal; window.openPrintableWindow = openPrintableWindow;
        window.updateState = function(key, value) { window.state[key] = value; calculate(); render(); };
        window.handleInputChange = function(event, key) { let value = event.target.value; if (event.target.type === 'number') { value = value === "" ? "" : parseFloat(value); } if (event.target.type === 'range') { value = parseInt(value); } window.state[key] = value; calculate(); render(); };
        
        // --- UPDATED PAYMENT HANDLERS v7.22 ---
        window.handleProductionChange = function(event, key) { 
            const tE = parseFloat(event.target.value); window.state[key] = tE; 
            if (!isNaN(tE) && window.state.tR) { 
                const solarPart = (window.state.tR * tE) / 12;
                window.state.pa = solarPart + (window.state.paB || 0);
            } 
            calculate(); render(); 
        };
        window.handleRateChange = function(event, key) { 
            const tR = parseFloat(event.target.value); window.state[key] = tR; 
            if (!isNaN(tR) && window.state.tE) { 
                const solarPart = (tR * window.state.tE) / 12;
                window.state.pa = solarPart + (window.state.paB || 0);
            } 
            calculate(); render(); 
        };
        window.handleBatteryPaymentChange = function(event, key) {
            const paB = parseFloat(event.target.value); window.state[key] = paB;
            if (!isNaN(paB) && window.state.tE && window.state.tR) {
                 const solarPart = (window.state.tR * window.state.tE) / 12;
                 window.state.pa = solarPart + paB;
            } 
            calculate(); render();
        };
        window.handlePaymentChange = function(event, key) { 
            const pa = parseFloat(event.target.value); window.state[key] = pa; 
            const solarPart = Math.max(0, pa - (window.state.paB || 0));
            if (!isNaN(pa) && window.state.tE && window.state.tE > 0) { 
                window.state.tR = (solarPart * 12) / window.state.tE; 
            } 
            calculate(); render(); 
        };
        
        // v7.23: Smart Update for Self Consumption when Battery Changes
        window.handleBatteryChange = function(event, key) {
            const b = parseFloat(event.target.value) || 0;
            window.state[key] = b;
            updateSCR();
            calculate(); render();
        };

        // v7.25: Update Self Consumption Rate based on Usable Battery Capacity
        window.handleReserveChange = function(event, key) {
            const br = parseFloat(event.target.value) || 0;
            window.state[key] = br;
            updateSCR();
            calculate(); render();
        };

        // v7.27: Smart Preset Loader
        window.handleUtilityChange = function(event, key) {
            const val = event.target.value;
            window.state[key] = val;
            // Preset Map
            const rates = {
                nem2: { r: 0.48, e: 0.45 },
                nem3: { r: 0.48, e: 0.05 },
                roseville: { r: 0.16, e: 0.06 },
                smud: { r: 0.19, e: 0.07 },
                xcel_co: { r: 0.16, e: 0.16 },
                other: { r: 0.35, e: 0.05 }
            };
            if (rates[val]) {
                window.state.rU = rates[val].r;
                window.state.eU = rates[val].e;
            }
            calculate();
            render();
        }

        function updateSCR() {
            const { b, br, sz } = window.state;
            const usable = Math.max(0, b * (1 - (br / 100)));
            // v7.26 Logic Upgrade:
            // Calculate Daily Production Estimate (Average day)
            // If we have calculated data 'r', use that. Else approximate.
            const dailyGen = (window.state.r && window.state.r.estDay) ? window.state.r.estDay : (sz * 4.2); // Fallback to 4.2 sun hours
            
            let boost = 0;
            if (dailyGen > 0) {
                // Boost = (Usable Battery / Daily Gen) * 100
                // Example: 8kWh Battery / 40kWh Gen = 0.20 = 20% Boost
                boost = (usable / dailyGen) * 100;
            }
            
            // Base 60% + Boost (Max 98%)
            let calculatedSCR = Math.min(60 + boost, 98);
            window.state.scr = parseFloat(calculatedSCR.toFixed(1));
        }

        document.addEventListener('DOMContentLoaded', () => { calculate(); render(); });
    </script>
</body>
