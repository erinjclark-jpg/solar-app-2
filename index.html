<!-- 
================================================================================
PROJECT CONTEXT: SolarCheck Professional
Current Version: v7.224 (PROTOCOL REINFORCEMENT & CONTEXT ANCHOR)
Date: February 2026
Architecture: Modular Single-File HTML5 (Sub-Renderer Pattern)
================================================================================

1. OVERVIEW
   Multi-purpose solar platform: Inspection (Field), Valuation (Bank), Buyback (Investor).

2. AI SESSION PROTOCOL (STRICT ADHERENCE REQUIRED - DO NOT REMOVE)
   A. CARRY FORWARD: This header and 'window.UI_TEXT' / 'window.UI_NARRATIVES' 
      must be included in every generated version. DO NOT simplify or paraphrase.
   B. NO TRUNCATION: Always output 100% of the code. Never use placeholders like "...".
   C. VERSION CONTROL: Increment version (v7.xxx) with every single change.
   D. UI TEXT LOCK: NEVER modify descriptions or tooltips in the UI_TEXT object 
      unless the user explicitly requests a terminology change.
   E. ARCHITECTURE: All HTML, CSS, and JS must remain in this one file.
   F. SINGLE SOURCE OF TRUTH: All UI elements must pull strings from window.UI_TEXT.
      All results must be calculated in calculate() and stored in window.state.r/aR.

3. CORE LOGIC ENGINES
   - BUCKET MODEL: Usable = Total * (1-Reserve). SCR boost = Battery / Daily Gen.
   - PERFORMANCE RATIO: Actual / Benchmark. (Owned = Physical, TPO = Contract).
   - VALUATION: USPAP Blended (DCF Income Approach + Depreciated Cost Approach).
   - BUYBACK: NPV of (Lease Rev - OpEx - CapEx) @ Target IRR. 
================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarCheck Professional v7.224</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .tab-content { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            body { background: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            h1, h2, h3 { page-break-after: avoid; }
            img { max-width: 100%; }
            .break-inside-avoid { break-inside: avoid; }
            .page-break { page-break-before: always; }
        }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        dialog::backdrop { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); }
        .modal { max-width: 95vw; width: 450px; }
        .header-btn { flex-shrink: 0; white-space: nowrap; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <div id="root"></div>
    <div id="report-view" class="hidden min-h-screen bg-slate-50 pb-20 absolute top-0 left-0 w-full z-50"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =====================================================================
        // [UI_TEXT_CATALOG] - THE SINGLE SOURCE OF TRUTH FOR LABELS & NARRATIVES
        // =====================================================================
        window.UI_TEXT = {
            company: { l: "Company Profile", d: "Select the primary service provider logo and license for the final report.", p: "" },
            ownership: { l: "Ownership Agreement", d: "Owned systems are property assets. Lease/PPA (TPO) systems are financial liabilities.", p: "" },
            address: { l: "Property Address", d: "The physical address used for asset tracking and location-based utility mapping.", p: "123 Solar Way, Rocklin CA" },
            pC: { l: "Panel Count", d: "Total quantity of PV modules.", p: "e.g. 20" },
            pW: { l: "Panel Watts", d: "Individual module power rating (STC).", p: "e.g. 400" },
            panelBrand: { l: "Panel Brand", d: "Module manufacturer for warranty audit.", p: "e.g. Q-Cells" },
            it: { l: "Inverter Type", d: "String (one unit) vs. Micro (one per panel).", p: "" },
            invBrand: { l: "Inverter Brand", d: "Primary hardware ecosystem.", p: "" },
            invCount: { l: "Unit Count", d: "Quantity of inverters or microinverters.", p: "e.g. 1" },
            invAge: { l: "Hardware Age", d: "Years in service (for replacement risk assessment).", p: "Years" },
            batteryBrand: { l: "Battery Brand", d: "Energy storage manufacturer.", p: "e.g. Tesla" },
            b: { l: "Battery Capacity (kWh)", d: "Total nameplate energy storage.", p: "e.g. 13.5" },
            br: { l: "Reserve Setting (%)", d: "Energy reserved for power outages.", p: "e.g. 20" },
            cellMon: { l: "Cellular Comms", d: "Active cellular reporting status.", p: "" },
            iDt: { l: "Install Date (PTO)", d: "Permission to Operate (original activation date).", p: "" },
            ac: { l: "Meter Reading (MWh)", d: "Verified lifetime output from the solar monitoring app.", p: "e.g. 35.5" },
            pDt: { l: "Reading Date", d: "Date the meter was read.", p: "" },
            ut: { l: "Utility Preset", d: "Select the regional utility tariff structure.", p: "" },
            scr: { l: "Site Consumption (%)", d: "The percentage of energy consumed on-site vs exported to grid.", p: "e.g. 60" },
            rU: { l: "Retail Rate ($)", d: "Utility import cost.", p: "0.48" },
            eU: { l: "Export Rate ($)", d: "Excess solar credit.", p: "0.05" },
            or: { l: "Array Azimuth", d: "Horizontal orientation of the panels.", p: "" },
            pi: { l: "Roof Pitch", d: "The vertical slope of the panel array.", p: "" },
            sh: { l: "Shading Impact", d: "Physical obstructions affecting sunshine.", p: "" },
            te: { l: "Contract Term (Years)", d: "Total length of the service agreement.", p: "e.g. 20" },
            tEs: { l: "Annual Escalator (%)", d: "The fixed annual increase in the solar rate.", p: "e.g. 2.9" },
            tE: { l: "Year 1 Est. Production (kWh)", d: "The original sales estimate for the first year.", p: "e.g. 10000" },
            tG: { l: "Guaranteed Minimum (kWh)", d: "The contractual floor for production claims.", p: "e.g. 9000" },
            tR: { l: "Solar Rate ($/kWh)", d: "Initial price per unit of solar energy.", p: "e.g. 0.255" },
            paB: { l: "Battery Fixed Fee ($)", d: "Optional fixed monthly storage cost.", p: "e.g. 0.00" },
            pa: { l: "Total Monthly Payment ($)", d: "The actual initial monthly liability.", p: "e.g. 150.00" },
            fTe: { l: "Total Estimated (kWh)", d: "Calculated total term energy output.", p: "Awaiting data..." },
            fTg: { l: "Total Guaranteed (kWh)", d: "Calculated legal production floor.", p: "Awaiting data..." },
            dr: { l: "Discount Rate (%)", d: "Target return or cost of capital (Standard: 6-10%).", p: "7.88" },
            e: { l: "Utility Escalation (%)", d: "Assumed annual utility rate inflation.", p: "7.0" },
            rC: { l: "Replacement Cost ($/W)", d: "Current cost per watt to build a similar new system.", p: "3.50" },
            l: { l: "Useful Life (Years)", d: "Estimated total life of equipment (Standard: 30y).", p: "30" },
            ne: { l: "NEM Policy", d: "Tariff adjustment for net metering value.", p: "" },
            c: { l: "Asset Condition (0-1)", d: "Physical health multiplier (1.0 = Perfect).", p: "0.9" },
            srec: { l: "Include SRECs / Incentives?", d: "Toggle for secondary solar revenue streams.", p: "" },
            srecP: { l: "SREC Value ($/MWh)", d: "Current market value of Solar Renewable Energy Credits.", p: "25" },
            bb_rate: { l: "Annual Lease Rate", d: "Proposed solar rate for the homeowner.", p: "0.15" },
            bb_term: { l: "Lease Term (Years)", d: "Investor hold period.", p: "15" },
            bb_irr: { l: "Target IRR (%)", d: "Yield requirement for the acquisition.", p: "12" },
            bb_opex: { l: "Admin OpEx ($/kW)", d: "Estimated annual overhead costs.", p: "10" }
        };

        window.UI_NARRATIVES = {
            contract_intro: "For Lease/PPA systems, the homeowner pays a monthly fee to use the energy. We must verify if the solar rate is cheaper than the grid and if the provider is meeting their production guarantees.",
            arbitrage_intro: "This audit verifies if the solar energy is cheaper than the electricity bought from the utility. A positive delta means the system is creating financial value.",
            perf_ratio_intro: "This is the health score of the system. 100% means the system is performing exactly as designed. Anything below 85% suggests a technical issue or significant shading.",
            valuation_cost_footer: "Value based on building a new system today minus depreciation.",
            valuation_inc_footer: "Value based on the net energy savings the system provides over its life.",
            buyback_intro: "This model determines the maximum price an investor can offer to buy the system and lease it back to the homeowner while meeting a target Internal Rate of Return (IRR)."
        };

        // --- GLOBAL HELPERS ---
        const GITHUB_BASE = "https://raw.githubusercontent.com/rocklinsolarrepair/assets/main/"; 
        window.cur = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v || 0);
        window.cur3 = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 3 }).format(v || 0);
        window.num = (v) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 }).format(v || 0);
        window.per = (v) => (v * 100).toFixed(1) + "%";

        window.I = function(l, v, key, t = "number", d, st = "0.01", disabled = false, handler = "handleInputChange", placeholder = "") { 
            const txt = window.UI_TEXT[key] || { l, d, p: placeholder };
            return `<div class=""><label for="${key}" class="block text-slate-700 text-xs sm:text-sm mb-1 font-bold uppercase tracking-wide">${txt.l}</label><input type="${t}" step="${st}" id="${key}" placeholder="${txt.p}" class="w-full p-2 sm:p-2.5 border border-slate-300 rounded-lg text-slate-800 text-base sm:text-lg font-semibold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow ${disabled ? 'bg-slate-100 text-slate-500' : 'bg-white'}" value="${v}" ${disabled ? 'disabled' : ''} onchange="${handler}(event,'${key}')"/><p class="text-[10px] text-slate-500 mt-1 leading-snug font-medium italic">${txt.d || ''}</p></div>`; 
        };
        window.Idark = function(l, v, key, t = "number", d, st = "0.01", disabled = false) { 
            const txt = window.UI_TEXT[key] || { l, d, p: "" };
            return `<div class=""><label for="${key}" class="block text-blue-200 text-xs sm:text-sm mb-1 font-bold uppercase tracking-wide">${txt.l}</label><input type="${t}" step="${st}" id="${key}" placeholder="${txt.p}" class="w-full p-2 sm:p-2.5 border border-slate-500 rounded-lg bg-slate-700/50 text-white text-base sm:text-lg font-semibold focus:ring-2 focus:ring-blue-400 focus:border-blue-400 placeholder-slate-400 backdrop-blur-sm ${disabled ? 'opacity-50 cursor-not-allowed' : ''}" value="${v}" ${disabled ? 'disabled' : ''} onchange="handleInputChange(event,'${key}')"/><p class="text-[10px] text-blue-300 mt-1 leading-snug italic">${txt.d || ''}</p></div>`; 
        };
        window.Sdark = function(l, v, key, o, d) { 
            const txt = window.UI_TEXT[key] || { l, d };
            return `<div class=""><label for="${key}" class="block text-blue-200 text-xs sm:text-sm mb-1 font-bold uppercase tracking-wide">${txt.l}</label><select id="${key}" class="w-full p-2 sm:p-2.5 border border-slate-500 rounded-lg bg-slate-700/50 text-white text-base sm:text-lg font-semibold focus:ring-2 focus:ring-blue-400 focus:border-blue-400 backdrop-blur-sm" onchange="handleInputChange(event,'${key}')">${o.map(x => `<option value="${x.v}" ${v == x.v ? 'selected' : ''}>${x.l}</option>`).join('')}</select><p class="text-[10px] text-blue-300 mt-1 leading-snug italic">${txt.d || ''}</p></div>`; 
        };
        window.S = function(l, v, key, o, d, handler = "handleInputChange") { 
            const txt = window.UI_TEXT[key] || { l, d };
            return `<div class=""><label for="${key}" class="block text-slate-700 text-xs sm:text-sm mb-1 font-bold uppercase tracking-wide">${txt.l}</label><select id="${key}" class="w-full p-2 sm:p-2.5 border border-slate-300 rounded-lg text-slate-800 text-base sm:text-lg font-semibold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white" onchange="${handler}(event,'${key}')">${o.map(x => `<option value="${x.v}" ${v == x.v ? 'selected' : ''}>${x.l}</option>`).join('')}</select><p class="text-[10px] text-slate-500 mt-1 leading-snug font-medium italic">${txt.d || ''}</p></div>`; 
        };
        window.R = function(l, v, s, d) { 
            return `<div class="mb-4 border-b border-slate-100 pb-3 last:border-0 last:pb-0"><div class="flex justify-between items-center text-sm sm:text-base"><span class="font-bold text-slate-700">${l}</span><span class="font-bold text-slate-900 text-base sm:text-lg">${v} <span class="text-xs text-slate-600 font-normal">${s}</span></span></div>${d ? `<p class="text-[10px] sm:text-[11px] text-slate-600 leading-tight mt-1 font-medium">${d}</p>` : ''}</div>`; 
        };
        window.C = function(t, d, children, c = 'text-slate-800', cl = '', icon = '', wrapperCl = '') {
            let iH = '';
            if (icon === '🛡️' || t.includes("Warranty")) iH = '<i class="fas fa-shield-halved mr-2 text-indigo-600"></i>';
            else if (icon === '📊' || t.includes("Performance")) iH = '<i class="fas fa-chart-line mr-2 text-green-600"></i>';
            else if (t.includes("Profile")) iH = '<i class="fas fa-solar-panel mr-2 text-blue-600"></i>';
            else if (t.includes("Economics") || t.includes("Savings") || t.includes("Homeowner Value")) iH = '<i class="fas fa-sack-dollar mr-2 text-emerald-700"></i>';
            else if (t.includes("TPO") || t.includes("Contract")) iH = '<i class="fas fa-file-contract mr-2 text-slate-700"></i>';
            else if (t.includes("Buyback") || t.includes("Deal") || t.includes("Investor")) iH = '<i class="fas fa-handshake mr-2 text-yellow-600"></i>';
            else if (t.includes("Matrix")) iH = '<i class="fas fa-table mr-2 text-blue-700"></i>';
            else if (t.includes("Analysis") || icon === 'chart-bar') iH = '<i class="fas fa-chart-bar mr-2 text-indigo-600"></i>';
            else if (t.includes("Arbitrage") || icon === 'balance-scale') iH = '<i class="fas fa-balance-scale-right mr-2 text-purple-600"></i>';
            return `<div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow duration-300 break-inside-avoid ${cl} ${wrapperCl}"><div class="border-b border-slate-100 pb-4 mb-5"><h3 class="text-lg sm:text-xl font-bold flex items-center ${c}">${iH}${t}</h3>${d ? `<p class="text-[11px] sm:text-xs text-slate-600 mt-1 font-medium italic">${d}</p>` : ''}</div>${children}</div>`;
        };

        // =====================================================================
        // [UI_TABS] - MODULAR COMPONENT RENDERERS
        // =====================================================================

        window.renderInputsTab = function(st, r) {
            return `<div class="tab-content space-y-4 sm:space-y-6">
                <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
                     <h3 class="font-bold mb-4 text-slate-800 flex items-center gap-2 text-[10px] sm:text-xs uppercase tracking-widest">Site & Branding</h3>
                     <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                        ${window.S("Company Profile", st.company, "company", [{v:'rsr', l:'Rocklin Solar Repair'}, {v:'shine', l:'Shine on Solar & Maintenance'}, {v:'ssoc', l:'Solar Service of Colorado'}])}
                        ${window.S("Ownership Agreement", st.o, "o", [{ v: "owned", l: "Homeowner Owned" }, { v: "lease", l: "Lease (Fixed Payment)" }, { v: "ppa", l: "PPA (Pay per kWh)" }, { v: "prepaid_lease", l: "Prepaid Lease" }, { v: "prepaid_ppa", l: "Prepaid PPA" }])}
                        <div class="col-span-1 sm:col-span-2">${window.I("Property Address", st.a, "a", "text")}</div>
                     </div>
                </div>
                <div class="bg-indigo-50 p-5 sm:p-6 rounded-2xl border border-indigo-100 shadow-sm">
                    <h4 class="font-bold text-indigo-900 text-xs sm:text-sm uppercase mb-4 border-b border-indigo-200 pb-2 flex items-center gap-2"><i class="fas fa-microchip"></i> Hardware Registry</h4>
                    <div class="mb-4"><h5 class="text-[9px] font-black text-indigo-800 uppercase mb-2 tracking-widest">Solar Panels</h5><div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">${window.I("Panel Count", st.pC, "pC", "number")}${window.I("Panel Watts", st.pW, "pW", "number")}<div class="col-span-2 sm:col-span-1">${window.I("Panel Brand", st.panelBrand, "panelBrand", "text")}</div></div></div>
                    <div class="mb-4 pt-4 border-t border-indigo-200"><h5 class="text-[9px] font-black text-indigo-800 uppercase mb-2 tracking-widest">Inverter System</h5><div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">${window.S("Type", st.it, "it", [{ v: "string", l: "String" }, { v: "micro", l: "Micro" }])}${window.S("Brand", st.invBrand, "invBrand", [{v:'Enphase', l:'Enphase'}, {v:'SolarEdge', l:'SolarEdge'}, {v:'SMA', l:'SMA'}, {v:'Fronius', l:'Fronius'}, {v:'Other', l:'Other'}])}${window.I("Unit Count", st.invCount, "invCount", "number")}${window.I("Hardware Age", st.invAge, "invAge", "number")}</div></div>
                    <div class="pt-4 border-t border-indigo-200"><h5 class="text-[9px] font-black text-indigo-800 uppercase mb-2 tracking-widest">Storage & Monitoring</h5><div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">${window.I("Battery Brand", st.batteryBrand, "batteryBrand", "text")}${window.I("Capacity (kWh)", st.b, "b", "number")}${window.I("Reserve (%)", st.br, "br", "number")}${window.S("Cellular", st.cellMon, "cellMon", [{v:'yes', l:'Active'}, {v:'no', l:'None'}])}</div></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                    <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200"><h4 class="font-bold text-slate-800 text-xs sm:text-sm uppercase mb-4 flex items-center gap-2"><i class="fas fa-chart-line text-green-600"></i> Production & Utility</h4><div class="space-y-4">${window.I("Install Date", st.iDt, "iDt", "date")}${window.I("Meter (MWh)", st.ac, "ac", "number")}${window.I("Reading Date", st.pDt, "pDt", "date")}${window.S("Utility Preset", st.ut, "ut", [{ v: "nem2", l: "NEM 2 (CA)" }, { v: "nem3", l: "NEM 3 (CA)" }, { v: "roseville", l: "Roseville" }, { v: "smud", l: "SMUD" }, { v: "xcel_co", l: "Xcel Co" }, { v: "other", l: "Custom Rate" }], "", "handleUtilityChange")}${window.I("Site Consumption (%)", st.scr, "scr", "number")}<div class="grid grid-cols-2 gap-3 sm:gap-4">${window.I("Retail Rate ($)", st.rU, "rU", "number")}${window.I("Export Rate ($)", st.eU, "eU", "number")}</div></div></div>
                    <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200"><h4 class="font-bold text-slate-800 text-xs sm:text-sm uppercase mb-4 flex items-center gap-2"><i class="fas fa-compass text-orange-500"></i> Site Characteristics</h4><div class="space-y-4">${window.S("Array Azimuth", st.or, "or", [{ v: "south", l: "South (Ideal)" }, { v: "mix", l: "Mixed" }, { v: "east_west", l: "East / West" }, { v: "north", l: "North (Poor)" }])}${window.S("Roof Pitch", st.pi, "pi", [{ v: "standard", l: "Standard (20-30°)" }, { v: "flat", l: "Flat (0-10°)" }, { v: "steep", l: "Steep (>35°)" }])}${window.S("Shading Impact", st.sh, "sh", [{ v: "none", l: "No Shade (100%)" }, { v: "some", l: "Some Shade (85%)" }, { v: "alot", l: "Heavy Shade (70%)" }])}</div></div>
                </div>
            </div>`;
        };

        window.renderContractTab = function(st, r) {
            if (st.o === 'owned') return `<div class="tab-content bg-white p-8 rounded-3xl shadow-sm border border-slate-200 min-h-[400px] flex flex-col items-center justify-center text-center text-slate-400"><i class="fas fa-file-circle-check text-7xl mb-6 text-slate-200"></i><h3 class="text-xl font-bold text-slate-500">No Contract Data Required</h3><p class="max-w-md mt-2 text-sm leading-relaxed">Homeowner Owned assets do not require contractual audit data as there is no 3rd party liability.</p></div>`;
            return `<div class="tab-content bg-white p-5 sm:p-8 rounded-3xl shadow-sm border border-slate-200 min-h-[400px]"><div class="max-w-3xl mx-auto"><div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-6"><div class="bg-blue-100 p-4 rounded-2xl text-blue-600 shadow-sm"><i class="fas fa-file-signature text-3xl"></i></div><div><h3 class="text-xl sm:text-2xl font-bold text-slate-800 uppercase tracking-tight">Lease / PPA Agreement</h3><p class="text-[11px] sm:text-xs text-slate-500 mt-1 uppercase tracking-widest font-bold">Audit terms to define financial liability.</p></div></div>
                <div class="mb-6 bg-blue-50 p-4 rounded-2xl border border-blue-100 text-[11px] font-medium text-blue-800 leading-relaxed"><i class="fas fa-info-circle mr-2"></i><strong>Why this matters:</strong> ${window.UI_NARRATIVES.contract_intro}</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8">

                    <div class="bg-white/80 backdrop-blur-md border-b sticky top-[56px] sm:top-[72px] z-40 px-2 sm:px-4 flex gap-1 pt-1 no-print overflow-x-auto shadow-sm no-scrollbar">
                        ${['inputs','contract','summary','valuation','buyback'].map(t => `
                            <button onclick="updateState('activeTab', '${t}')" class="flex-1 py-3 sm:py-5 border-b-4 font-black transition-all ${activeTab === t ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'} uppercase text-[8px] sm:text-[10px] tracking-widest sm:tracking-[0.2em] whitespace-nowrap flex flex-col items-center justify-center gap-1 sm:gap-2">
                                <i class="fas ${t === 'inputs' ? 'fa-edit' : t === 'contract' ? 'fa-file-signature' : t === 'summary' ? 'fa-list-check' : t === 'valuation' ? 'fa-scale-balanced' : 'fa-handshake'} text-base sm:text-xl"></i>
                                ${t}
                            </button>
                        `).join('')}
                    </div>
                    <div class="max-w-5xl mx-auto p-4 sm:p-8">${tabContent}</div>
                    <dialog id="print-modal" class="modal p-0 rounded-[32px] shadow-2xl border-0 overflow-hidden bg-white">
                        <div class="p-8 sm:p-10 w-full relative text-center">
                            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-300 hover:text-slate-600 transition-colors"><i class="fas fa-times text-2xl"></i></button>
                            <h3 class="font-black mb-6 uppercase text-[9px] tracking-[0.4em] border-b border-slate-100 pb-5 text-slate-400">Generate Audit</h3>
                            <button onclick="handleGenerateReport('realtor')" class="w-full text-left p-5 sm:p-6 border-2 border-slate-50 rounded-2xl hover:bg-blue-50 hover:border-blue-200 transition-all group flex items-center justify-between">
                                <div><p class="font-black uppercase text-xs tracking-widest text-slate-800">Branded Advisory Report</p><p class="text-[9px] sm:text-[10px] font-bold text-slate-500 mt-1">2-Page audit for realtors & homeowners.</p></div>
                                <i class="fas fa-chevron-right text-slate-300 group-hover:text-blue-400"></i>
                            </button>
                        </div>
                    </dialog>
                </div>`;
        };

        // --- INITIALIZATION ---
        let app, db, auth;
        const init = async () => {
            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                if (typeof __initial_auth_token !== 'undefined') await signInWithCustomToken(auth, __initial_auth_token); 
                else await signInAnonymously(auth); 
                window.calculate();
                window.render();
            } catch (err) {
                console.error("Initialization Failed:", err);
                window.calculate();
                window.render();
            }
        };
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
