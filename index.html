<!-- 
================================================================================
PROJECT CONTEXT: SolarCheck Professional
Current Version: v7.196 (UI: GITHUB LOGO INTEGRATION & FILTER FIX)
Date: February 2026
Architecture: Modular Single-File HTML5 (Sub-Renderer Pattern)

1. OVERVIEW
   A multi-purpose solar evaluation platform serving Field Inspectors, 
   Appraisers, and Investors. Improvements for one group must not degrade others.

2. USE CASE ISOLATION
   A. INSPECTION (Field): Simple, visual health bars. (Inputs & Summary Tabs).
   B. VALUATION (Bank): USPAP-aligned DCF/Cost math. (Valuation Tab).
   C. BUYBACK (Investor): IRR-based Pro-Forma modeling. (Buyback Tab).

3. DEPLOYMENT CONSTRAINTS
   - Single-File Mandate: All assets must remain in this file.
   - Printing: Uses window.printReport() for clean, asset-heavy PDF generation.
   - Assets: Supports absolute GitHub Raw paths for universal logo loading.

4. CORE LOGIC ENGINES
   - Bucket Model: Usable battery capacity affects Self-Consumption Rate (SCR).
   - Arbitrage Audit: Real-time delta between Solar Rate vs. Utility Rate.
   - DCF Valuation: Weights Income (Discounted Cash Flow) vs. Depreciated Cost.
   - Buyback Engine: NPV of (Revenue - OpEx - CapEx) @ Target IRR. 

5. UNIVERSAL REPORTING SYSTEM (JSON-DRIVEN)
   - BLOCK LIBRARY: window.BLOCK_LIBRARY is the central rendering authority.
   - v7.196: Universal Logo URL logic and color filter removal for branding.

6. AI SESSION PROTOCOL (MANDATORY)
   1. VERSION CONTROL: Increment version (v7.195 -> v7.196).
   2. UI TAB IMMUTABILITY: Never simplify the 5 core Tab rendering functions.
   3. SINGLE SOURCE OF TRUTH: Reports must ONLY read from window.state.r or aR.
================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarCheck Professional v7.196</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .tab-content { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            body { background: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            h1, h2, h3 { page-break-after: avoid; }
            img { max-width: 100%; }
            .break-inside-avoid { break-inside: avoid; }
            .page-break { page-break-before: always; }
        }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-['Inter',sans-serif]">

    <div id="root"></div>
    <div id="report-view" class="hidden min-h-screen bg-slate-50 pb-20 absolute top-0 left-0 w-full z-50"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. GLOBAL HELPERS (SCOPE PROTECTION) ---
        // UPDATE THIS TO YOUR GITHUB REPO TO LOAD LOGOS EVERYWHERE
        const GITHUB_BASE = "https://raw.githubusercontent.com/[YOUR_USERNAME]/[YOUR_REPO]/main/";

        window.cur = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v || 0);
        window.num = (v) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 }).format(v || 0);
        window.per = (v) => (v * 100).toFixed(1) + "%";

        window.I = function(l, v, key, t = "number", d, st = "0.01", disabled = false, handler = "handleInputChange", placeholder = "") { 
            return `<div class=""><label for="${key}" class="block text-slate-700 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><input type="${t}" step="${st}" id="${key}" placeholder="${placeholder}" class="w-full p-2 border border-slate-300 rounded text-slate-800 text-lg font-semibold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow ${disabled ? 'bg-slate-100 text-slate-500' : 'bg-white'}" value="${v}" ${disabled ? 'disabled' : ''} onchange="${handler}(event,'${key}')"/><p class="text-sm text-slate-500 mt-1 leading-snug">${d || ''}</p></div>`; 
        };
        window.Idark = function(l, v, key, t = "number", d, st = "0.01", disabled = false) { 
            return `<div class=""><label for="${key}" class="block text-blue-200 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><input type="${t}" step="${st}" id="${key}" class="w-full p-2 border border-slate-500 rounded bg-slate-700/50 text-white text-lg font-semibold focus:ring-2 focus:ring-blue-400 focus:border-blue-400 placeholder-slate-400 backdrop-blur-sm ${disabled ? 'opacity-50 cursor-not-allowed' : ''}" value="${v}" ${disabled ? 'disabled' : ''} onchange="handleInputChange(event,'${key}')"/><p class="text-sm text-blue-400 mt-1 leading-snug">${d || ''}</p></div>`; 
        };
        window.Sdark = function(l, v, key, o, d) { 
            return `<div class=""><label for="${key}" class="block text-blue-200 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><select id="${key}" class="w-full p-2 border border-slate-500 rounded bg-slate-700/50 text-white text-lg font-semibold focus:ring-2 focus:ring-blue-400 focus:border-blue-400 backdrop-blur-sm" onchange="handleInputChange(event,'${key}')">${o.map(x => `<option value="${x.v}" ${v == x.v ? 'selected' : ''}>${x.l}</option>`).join('')}</select><p class="text-sm text-blue-400 mt-1 leading-snug">${d || ''}</p></div>`; 
        };
        window.S = function(l, v, key, o, d, handler = "handleInputChange") { 
            return `<div class=""><label for="${key}" class="block text-slate-700 text-sm sm:text-base mb-1 font-bold uppercase tracking-wide">${l}</label><select id="${key}" class="w-full p-2 border border-slate-300 rounded text-slate-800 text-lg font-semibold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white" onchange="${handler}(event,'${key}')">${o.map(x => `<option value="${x.v}" ${v == x.v ? 'selected' : ''}>${x.l}</option>`).join('')}</select><p class="text-sm text-slate-500 mt-1 leading-snug">${d || ''}</p></div>`; 
        };
        window.R = function(l, v, s, d) { 
            return `<div class="mb-4 border-b border-slate-100 pb-3 last:border-0 last:pb-0"><div class="flex justify-between items-center text-base sm:text-lg"><span class="font-bold text-slate-700">${l}</span><span class="font-bold text-slate-900 text-lg sm:text-xl">${v} <span class="text-sm sm:text-base text-slate-600 font-normal">${s}</span></span></div>${d ? `<p class="text-sm text-slate-600 leading-tight mt-1 font-medium">${d}</p>` : ''}</div>`; 
        };
        window.C = function(t, d, children, c = 'text-slate-800', cl = '', icon = '', wrapperCl = '') {
            let iH = '';
            if (icon === '🛡️' || t.includes("Warranty")) iH = '<i class="fas fa-shield-halved mr-2 text-indigo-600"></i>';
            else if (icon === '📊' || t.includes("Performance")) iH = '<i class="fas fa-chart-line mr-2 text-green-600"></i>';
            else if (t.includes("Profile")) iH = '<i class="fas fa-solar-panel mr-2 text-blue-600"></i>';
            else if (t.includes("Economics") || t.includes("Savings") || t.includes("Homeowner Value")) iH = '<i class="fas fa-sack-dollar mr-2 text-emerald-700"></i>';
            else if (t.includes("TPO") || t.includes("Contract")) iH = '<i class="fas fa-file-contract mr-2 text-slate-700"></i>';
            else if (t.includes("Buyback") || t.includes("Deal") || t.includes("Investor")) iH = '<i class="fas fa-handshake mr-2 text-yellow-600"></i>';
            else if (t.includes("Matrix")) iH = '<i class="fas fa-table mr-2 text-blue-700"></i>';
            else if (t.includes("Analysis") || icon === 'chart-bar') iH = '<i class="fas fa-chart-bar mr-2 text-indigo-600"></i>';
            else if (t.includes("Arbitrage") || icon === 'balance-scale') iH = '<i class="fas fa-balance-scale-right mr-2 text-purple-600"></i>';
            return `<div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow duration-300 break-inside-avoid ${cl} ${wrapperCl}"><div class="border-b border-slate-100 pb-4 mb-5"><h3 class="text-2xl font-bold flex items-center ${c}">${iH}${t}</h3>${d ? `<p class="text-base text-slate-600 mt-1 font-medium">${d}</p>` : ''}</div>${children}</div>`;
        };

        // =====================================================================
        // [LOCK_START: UI_TABS] - IMMUTABLE CORE COMPONENTS
        // =====================================================================

        window.renderInputsTab = function(st, r) {
            return `<div class="tab-content space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                     <h3 class="font-bold mb-4 text-slate-800 flex items-center gap-2 text-lg uppercase tracking-wide">Site & Branding</h3>
                     <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        ${window.S("Company Profile", st.company, "company", [{v:'rsr', l:'Rocklin Solar Repair'}, {v:'shine', l:'Shine on Solar & Maintenance'}, {v:'ssoc', l:'Solar Service of Colorado'}], "Select which company header/footer to use on reports.", "handleCompanyChange")}
                        ${window.S("Ownership Agreement", st.o, "o", [{ v: "owned", l: "Homeowner Owned" }, { v: "lease", l: "Lease (Fixed Payment)" }, { v: "ppa", l: "PPA (Pay per kWh)" }, { v: "prepaid_lease", l: "Prepaid Lease" }, { v: "prepaid_ppa", l: "Prepaid PPA" }], "Select the type of ownership agreement currently in place.")}
                        <div class="col-span-1 sm:col-span-2">${window.I("Property Address", st.a, "a", "text", "The physical address of the solar installation for verification.", "", false, "handleInputChange", "123 Solar Way, Rocklin CA")}</div>
                     </div>
                </div>
                <div class="bg-indigo-50 p-6 rounded-xl border border-indigo-100 shadow-sm">
                    <h4 class="font-bold text-indigo-900 text-lg uppercase mb-4 border-b border-indigo-200 pb-2 flex items-center gap-2"><i class="fas fa-microchip"></i> Hardware Registry</h4>
                    <div class="mb-4"><h5 class="text-xs font-bold text-indigo-800 uppercase mb-2 tracking-widest">Solar Panels</h5><div class="grid grid-cols-1 sm:grid-cols-3 gap-4">${window.I("Panel Count", st.pC, "pC", "number", "Total quantity of panels on roof.", "1", false, "handleInputChange", "1")}${window.I("Panel Watts", st.pW, "pW", "number", "Nameplate rating (e.g. 300, 400).", "1", false, "handleInputChange", "400")}${window.I("Panel Brand", st.panelBrand, "panelBrand", "text", "Manufacturer name (e.g. SunPower).", "", false, "handleInputChange", "SunPower")}</div></div>
                    <div class="mb-4 pt-4 border-t border-indigo-200"><h5 class="text-xs font-bold text-indigo-800 uppercase mb-2 tracking-widest">Inverter System</h5><div class="grid grid-cols-1 sm:grid-cols-4 gap-4">${window.S("Inverter Type", st.it, "it", [{ v: "string", l: "String (Central)" }, { v: "micro", l: "Microinverters" }], "The technical architecture of the system.")}${window.S("Inverter Brand", st.invBrand, "invBrand", [{v:'Enphase', l:'Enphase'}, {v:'SolarEdge', l:'SolarEdge'}, {v:'SMA', l:'SMA'}, {v:'Fronius', l:'Fronius'}, {v:'Other', l:'Other'}], "Manufacturer of the inverter hardware.")}${window.I("Unit Count", st.invCount, "invCount", "number", "Number of inverters/micros.", "1", false, "handleInputChange", "1")}${window.I("Hardware Age", st.invAge, "invAge", "number", "Actual age of the hardware components.", "1", false, "handleInputChange", "10")}</div></div>
                    <div class="pt-4 border-t border-indigo-200"><h5 class="text-xs font-bold text-indigo-800 uppercase mb-2 tracking-widest">Energy Storage & Monitoring</h5><div class="grid grid-cols-1 sm:grid-cols-4 gap-4">${window.I("Battery Brand", st.batteryBrand, "batteryBrand", "text", "Manufacturer (e.g. Tesla, LG).", "", false, "handleInputChange", "Tesla")}${window.I("Battery Capacity (kWh)", st.b, "b", "number", "Total storage installed capacity.", "1", false, "handleBatteryChange", "13.5")}${window.I("Reserve Setting (%)", st.br, "br", "number", "Reserved for power outages.", "5", false, "handleReserveChange", "20")}${window.S("Cellular Comms", st.cellMon, "cellMon", [{v:'yes', l:'Active (4G/5G)'}, {v:'no', l:'Inactive / None'}], "Gateway reporting status.")}</div></div>
                    <div class="pt-4 border-t border-indigo-200 mt-4"><h5 class="text-xs font-bold text-indigo-800 uppercase mb-2 tracking-widest">Condition & Repairs</h5><div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${window.I("Est. Repair Cost ($)", st.rp, "rp", "number", "Cost to restore system to optimal condition.", "1", false, "handleInputChange", "0")}</div></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200"><h4 class="font-bold text-slate-800 text-lg uppercase mb-4 flex items-center gap-2"><i class="fas fa-chart-line text-green-600"></i> Production & Utility</h4><div class="space-y-4">${window.I("Install Date (PTO)", st.iDt, "iDt", "date", "The date Permission to Operate was granted.")}${window.I("Meter Reading (MWh)", st.ac, "ac", "number", "Lifetime cumulative generation from inverter.", "0.01", false, "handleInputChange", "25.5")}${window.I("Reading Date", st.pDt, "pDt", "date", "Date the meter reading was taken.")}${window.S("Utility Preset", st.ut, "ut", [{ v: "nem2", l: "NEM 2 (CA)" }, { v: "nem3", l: "NEM 3 (CA)" }, { v: "roseville", l: "Roseville" }, { v: "smud", l: "SMUD" }, { v: "xcel_co", l: "Xcel Co" }, { v: "other", l: "Custom Rate" }], "Load regional utility rate structures.", "handleUtilityChange")}${window.I("Self-Consumption (%)", st.scr, "scr", "number", "Ratio of energy used on-site versus exported.", "0.1", false, "handleInputChange", "60")}<div class="grid grid-cols-2 gap-4">${window.I("Retail Rate ($)", st.rU, "rU", "number", "Cost per kWh.", "0.01", false, "handleInputChange", "0.48")}${window.I("Export Rate ($)", st.eU, "eU", "number", "Credit per kWh.", "0.01", false, "handleInputChange", "0.45")}</div></div></div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200"><h4 class="font-bold text-slate-800 text-lg uppercase mb-4 flex items-center gap-2"><i class="fas fa-compass text-orange-500"></i> Site Characteristics</h4><div class="space-y-4">${window.S("Array Azimuth", st.or, "or", [{ v: "south", l: "South (Ideal)" }, { v: "mix", l: "Mixed Direction" }, { v: "east_west", l: "East / West" }, { v: "north", l: "North (Poor)" }], "Compass direction of the panels.")}${window.S("Roof Pitch", st.pi, "pi", [{ v: "standard", l: "Standard (20-30°)" }, { v: "flat", l: "Flat (0-10°)" }, { v: "steep", l: "Steep (>35°)" }], "The vertical angle of the roof surface.")}${window.S("Shading Impact", st.sh, "sh", [{ v: "none", l: "No Shade (100%)" }, { v: "some", l: "Some Shade (85%)" }, { v: "alot", l: "Heavy Shade (70%)" }], "Tree or building obstructions.")}</div></div>
                </div>
            </div>`;
        };

        window.renderContractTab = function(st, r) {
            if (st.o === 'owned') return `<div class="tab-content bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[400px] flex flex-col items-center justify-center text-center text-slate-400"><i class="fas fa-file-circle-check text-6xl mb-4 text-slate-200"></i><h3 class="text-xl font-bold text-slate-500">No Contract Data Required</h3><p class="max-w-md mt-2">You have selected <strong>Homeowner Owned</strong>. Contract terms, escalators, and payment schedules are not applicable.</p></div>`;
            return `<div class="tab-content bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[400px]"><div class="max-w-3xl mx-auto"><div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-4"><div class="bg-blue-100 p-3 rounded-full text-blue-600 shadow-sm"><i class="fas fa-file-signature text-2xl"></i></div><div><h3 class="text-2xl font-bold text-slate-800 uppercase tracking-tight">Lease / PPA Agreement</h3><p class="text-slate-500 mt-1">Enter terms from the original solar contract for audit.</p></div></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                <div class="space-y-4"><h4 class="font-bold text-slate-700 uppercase text-xs tracking-widest border-b pb-1">Term & Escalation</h4>${window.I("Contract Term (Years)", st.te, "te", "number", "Total length of the legal agreement.", "1", false, "handleInputChange", "20")}${window.I("Annual Escalator (%)", st.tEs, "tEs", "number", "Annual payment increase percentage (e.g. 2.9%).", "0.1", false, "handleInputChange", "2.9")}</div>
                <div class="space-y-4"><h4 class="font-bold text-slate-700 uppercase text-xs tracking-widest border-b pb-1">Production Guarantees</h4>${window.I("Year 1 Est. Production (kWh)", st.tE, "tE", "number", "Modeled production found on contract.", "1", false, "handleProductionChange", "10000")}${window.I("Guaranteed Minimum (kWh)", st.tG, "tG", "number", "Mandatory performance guarantee floor.", "1", false, "handleInputChange", "9000")}</div>
                ${!st.o.includes('prepaid') ? `<div class="col-span-1 sm:col-span-2 bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-inner"><h4 class="font-bold text-slate-700 uppercase text-xs tracking-widest border-b pb-1 mb-4">Payment Structure</h4><div class="grid grid-cols-1 sm:grid-cols-2 gap-6">${window.I("Solar Rate ($/kWh)", (typeof st.tR === 'number' ? st.tR.toFixed(3) : st.tR), "tR", "number", "The Year 1 price per kilowatt hour.", "0.001", false, "handleRateChange", "0.200")}${window.I("Battery Fixed Fee ($)", (typeof st.paB === 'number' ? st.paB.toFixed(2) : st.paB), "paB", "number", "Monthly adder for energy storage hardware.", "0.01", false, "handleBatteryPaymentChange", "0.00")}<div class="sm:col-span-2">${window.I("Total Monthly Payment ($)", (typeof st.pa === 'number' ? st.pa.toFixed(2) : st.pa), "pa", "number", "The total Year 1 monthly cost including all adders.", "0.01", false, "handlePaymentChange", "150.00")}</div></div></div>` : `<div class="col-span-1 sm:col-span-2 bg-green-50 p-6 rounded-xl border border-green-200 text-center flex flex-col items-center justify-center py-8 shadow-inner"><i class="fas fa-check-circle text-green-500 text-3xl mb-2"></i><h4 class="font-bold text-green-800 uppercase text-sm tracking-widest mb-1">Prepaid Agreement</h4><p class="text-green-700 text-sm">This system was fully prepaid. There are no monthly payments or escalators.</p></div>`}
                <div class="col-span-1 sm:col-span-2"><h4 class="font-bold text-slate-700 uppercase text-xs tracking-widest border-b pb-1 mb-4">Lifetime Totals (Auto-Calculated)</h4><div class="grid grid-cols-1 sm:grid-cols-2 gap-6">${window.I("Total Est. Lifetime (kWh)", r ? window.num(r.fTe) : 0, "fTe", "text", "Cumulative sales projection over term.", "", true)}${window.I("Total Guar. Lifetime (kWh)", r ? window.num(r.fTg) : 0, "fTg", "text", "Cumulative guarantee floor over term.", "", true)}</div></div>
            </div></div></div>`;
        };

        window.renderSummaryTab = function(st, r) {
            const isTPO = ['lease', 'ppa', 'prepaid_lease', 'prepaid_ppa'].includes(st.o);
            const remTerm = isTPO ? Math.max(0, st.te - r.age).toFixed(1) : null;
            const delta = (st.rU || 0.35) - r.rYC;
            const discountPct = Math.max(0, (delta / (st.rU || 0.35)) * 100).toFixed(0);
            let arbitrageNarrative = "";
            if (isTPO) {
                if (delta > 0) arbitrageNarrative = `The solar energy rate is currently <span class="text-green-700 font-bold">$${delta.toFixed(2)}/kWh cheaper</span> than the local utility, representing a <span class="text-green-700 font-bold">${discountPct}% discount</span> on production.`;
                else arbitrageNarrative = `The solar energy rate is currently <span class="text-red-700 font-bold">$${Math.abs(delta).toFixed(2)}/kWh higher</span> than the grid. This arbitrage gap requires utility inflation to exceed ${st.tEs}% annually to reach parity.`;
            }
            let leaseAssessment = "";
            if (isTPO) {
                const act = r.act, est = r.estLifeMwh, gua = r.guarLifeMwh;
                if (act >= est) leaseAssessment = `<div class="mt-4 p-4 rounded-lg border bg-green-50 text-green-900 border-green-200 flex gap-3 items-start shadow-sm"><i class="fas fa-trophy mt-1 text-green-700 text-lg"></i><div class="text-sm font-bold"><span class="uppercase block text-xs text-green-700 mb-1">Performance Status</span>System is performing excellently, exceeding both the original sales estimate and the guaranteed minimum.</div></div>`;
                else if (act >= gua) leaseAssessment = `<div class="mt-4 p-4 rounded-lg border bg-blue-50 text-blue-900 border-blue-200 flex gap-3 items-start shadow-sm"><i class="fas fa-check-double mt-1 text-blue-700 text-lg"></i><div class="text-sm font-bold"><span class="uppercase block text-xs text-green-700 mb-1">Contract Compliant</span>System is meeting the mandatory guarantee, despite performing below the initial sales estimate.</div></div>`;
                else leaseAssessment = `<div class="mt-4 p-4 rounded-lg border bg-red-50 text-red-900 border-red-200 flex gap-3 items-start shadow-sm"><i class="fas fa-circle-exclamation mt-1 text-red-700 text-lg"></i><div class="text-sm font-bold"><span class="uppercase block text-xs text-red-700 mb-1">Underperforming</span>System is failing to meet the contractual guarantee. A performance claim should be filed.</div></div>`;
            }
            const variancePercent = Math.min(100, (r.act / (r.estLifeMwh || 1)) * 100);
            const varianceColor = (r.act >= r.estLifeMwh) ? 'bg-green-500' : 'bg-amber-500';

            return `<div class="tab-content space-y-6">
                ${window.C("System Profile", "A snapshot of the system's physical capacity (kW), current age, and forecasted yield.", `
                    <div class="grid grid-cols-1 ${remTerm ? 'sm:grid-cols-3' : 'sm:grid-cols-2'} gap-6 pt-2">
                        <div><p class="text-sm uppercase text-slate-600 font-bold">Rated Size</p><p class="text-4xl font-black text-blue-800">${st.sz.toFixed(2)} kW</p><p class="text-xs text-slate-500 font-medium">Total DC Power</p></div>

                    { type: 'GRID_BOX', data: { title: 'Warranty & Responsibility Audit', columns: [ { header: 'Maintenance', items: [`Provider: ${i.o.includes('owned') ? 'Homeowner' : 'TPO Provider covers normal wear.'}`, `Inverter Replacement: ${i.it === 'micro' ? 'Manufacturer 25y' : 'Service Included (12y).'}`, `Monitoring: Gateway connection active.`] }, { header: 'Requirements', items: [`Transfer: Buyer assumes remaining payments.`, `Credit: Soft pull required by lessor.`, `Timeline: 7-14 days for processing.`] } ] } },
                    { type: 'DATA_LIST', data: { title: 'Long-Term Value Projection', rows: [{l:'Est. Future Utility Savings', v: window.cur(r.futSav)}, {l:'Less: Remaining Payments', v: '-'+window.cur(r.remCost), c:'text-red-700'}, {l:'Projected Contract Savings', v: window.cur(r.futSavNet), border:true, c:'text-green-700'}], footer: `Inflation: ${i.e}%/yr | Escalator: ${i.tEs}%/yr` } },
                    { type: 'SECTION', data: { title: "EXECUTIVE SUMMARY", body: `This home at ${i.a || "this address"} includes a ${i.sz.toFixed(2)} kW solar energy system that has been physically inspected, production-verified, and contract-reviewed. This summary explains what those verified findings mean for a future homeowner and how the system contributes to the overall value of the property.` } },
                    { type: 'SECTION', data: { title: "EQUIPMENT & PRODUCTION VERIFICATION", body: `The solar equipment was physically inspected and system production was confirmed through monitoring data. The ${i.sz.toFixed(2)} kW system is estimated to produce approximately ${window.num(r.estN12)} kWh per year, offsetting a meaningful portion of the home’s electricity usage and reducing exposure to future rate increases.` } },
                    { type: 'SECTION', data: { title: "MONTHLY & LONG-TERM POSITION", body: `The system is estimated to generate a projected positive net position of about ${window.cur((r.potSav*r.pr/12)-(i.pa||0))} per month. Over the remaining ${Math.floor(i.te-r.age)} years of the agreement, projected future utility savings of ${window.cur(r.futSav)} are estimated to result in a projected net positive position of approximately ${window.cur(r.futSavNet)}.` } },
                    { type: 'SECTION', data: { title: "MAINTENANCE & RESPONSIBILITY", body: `Monitoring and major equipment performance are covered by the provider under the current agreement structure, ensuring pricing stability by securing a portion of the home’s energy costs without unexpected repair expenses.` } },
                    { type: 'NARRATIVE', data: { body: "Disclaimer: This independent report is based on provided system specifications and historical utility data. Future savings are estimates and depend on weather, usage patterns, and utility rate changes." } }
                ];
            }
            rv.innerHTML = `<div class="max-w-4xl mx-auto p-12 bg-white min-h-screen shadow-2xl" id="report-content">${window.renderReport(config, i)}</div><div class="fixed bottom-0 left-0 right-0 bg-white border-t p-6 flex justify-end gap-3 no-print z-50"><button onclick=\"window.open(window.location.href, '_blank')\" class=\"bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-sm shadow-xl flex items-center gap-2 transition-all hover:scale-105 active:scale-95\"><i class=\"fas fa-expand\"></i> Full Screen</button><button onclick="window.printReport()" class="bg-indigo-600 text-white px-8 py-4 rounded-xl font-black uppercase shadow-xl hover:scale-105">Open Printable Report</button><button onclick="window.closeReport()" class="border-2 p-4 px-8 rounded-xl font-black uppercase text-slate-700">Close</button></div>`;
            window.scrollTo(0, 0);
        };

        // --- 6. UTILITY BINDINGS ---
        window.closeReport = () => { document.getElementById('report-view').classList.add('hidden'); document.getElementById('root').classList.remove('hidden'); window.scrollTo(0, 0); window.render(); };
        window.printReport = () => { const c = document.getElementById('report-content').innerHTML; const win = window.open('', '_blank'); win.document.write(`<html><head><script src="https://cdn.tailwindcss.com"><\/script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>@media print { .page-break { page-break-before: always; } }</style></head><body onload="window.print()"><div class="p-10 max-w-[850px] mx-auto">${c}</div></body></html>`); win.document.close(); };
        window.updateState = function(k, v) { window.state[k] = v; window.calculate(); window.render(); };
        window.handleInputChange = function(e, k) { let v = e.target.value; if (e.target.type === 'number') v = v === "" ? "" : parseFloat(v); window.state[k] = v; window.calculate(); window.render(); };
        window.handleCompanyChange = function(e) { window.state.company = e.target.value; localStorage.setItem('solarCheck_company', e.target.value); window.render(); };
        window.handleProductionChange = function(e) { const tE = parseFloat(e.target.value); window.state.tE = tE; if (!isNaN(tE) && window.state.tR) window.state.pa = parseFloat(((window.state.tR * tE) / 12 + (window.state.paB || 0)).toFixed(2)); window.calculate(); window.render(); };
        window.handleRateChange = function(e) { const tR = parseFloat(e.target.value); window.state.tR = tR; if (!isNaN(tR) && window.state.tE) window.state.pa = parseFloat(((tR * window.state.tE) / 12 + (window.state.paB || 0)).toFixed(2)); window.calculate(); window.render(); };
        window.handleBatteryPaymentChange = function(e) { const paB = parseFloat(e.target.value); window.state.paB = paB; if (!isNaN(paB) && window.state.tE && window.state.tR) window.state.pa = parseFloat(((window.state.tR * window.state.tE) / 12 + paB).toFixed(2)); window.calculate(); window.render(); };
        window.handlePaymentChange = function(e) { const pa = parseFloat(e.target.value); window.state.pa = pa; const sPart = Math.max(0, pa - (window.state.paB || 0)); if (!isNaN(pa) && window.state.tE > 0) window.state.tR = parseFloat(((sPart * 12) / window.state.tE).toFixed(4)); window.calculate(); window.render(); };
        window.handleBatteryChange = function(e) { window.state.b = parseFloat(e.target.value) || 0; window.calculate(); window.render(); };
        window.handleReserveChange = function(e) { window.state.br = parseFloat(e.target.value) || 0; window.calculate(); window.render(); };
        window.handleUtilityChange = function(e) { const v = e.target.value; window.state.ut = v; const rates = { nem2: { r: 0.48, e: 0.45, esc: 9.0 }, nem3: { r: 0.48, e: 0.05, esc: 9.0 }, roseville: { r: 0.16, e: 0.06, esc: 2.75 }, smud: { r: 0.19, e: 0.07, esc: 3.5 }, xcel_co: { r: 0.16, e: 0.16, esc: 3.5 }, other: { r: 0.35, e: 0.05, esc: 3.5 } }; if (rates[v]) { window.state.rU = rates[v].r; window.state.eU = rates[v].e; window.state.e = rates[v].esc; } window.calculate(); window.render(); };
        window.openModal = (id) => { window.state.activeModal = id; window.render(); };
        window.closeModal = () => { window.state.activeModal = null; window.render(); };

        window.render = function() {
            const { activeTab, activeModal, r, aR } = window.state;
            const root = document.getElementById('root'); if (!root) return;
            let tabContent = "";
            if (activeTab === 'inputs') tabContent = window.renderInputsTab(window.state, r);
            else if (activeTab === 'contract') tabContent = window.renderContractTab(window.state, r);
            else if (activeTab === 'summary' && r) tabContent = window.renderSummaryTab(window.state, r);
            else if (activeTab === 'valuation' && aR) tabContent = window.renderValuationTab(window.state, aR);
            else if (activeTab === 'buyback' && r) tabContent = window.renderBuybackTab(window.state, r);

            root.innerHTML = `<div class="min-h-screen bg-slate-50 pb-10"><div class="bg-[#005088] text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md"><div class="flex items-center gap-3"><span class="text-3xl"><i class="fas fa-sun text-yellow-400"></i></span><div><h1 class="font-bold text-xl sm:text-2xl tracking-tight">SolarCheck</h1><p class="text-xs opacity-90 font-black uppercase tracking-widest">Pro v7.196</p></div></div><div class=\"flex items-center gap-2\"><button onclick=\"window.open(window.location.href, '_blank')\" class=\"bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-sm shadow-xl flex items-center gap-2 transition-all hover:scale-105 active:scale-95\"><i class=\"fas fa-expand\"></i> Full Screen</button><button onclick=\"openModal('print-modal')\" class=\"bg-yellow-400 text-black px-5 py-2.5 rounded-xl font-black text-sm shadow-xl flex items-center gap-2 transition-all hover:scale-105 active:scale-95\"><i class=\"fas fa-file-pdf\"></i> Reports</button></div></div><div class=\"bg-white border-b sticky top-20 z-40 px-4 flex gap-1 pt-2 no-print overflow-x-auto shadow-sm\">${['inputs','contract','summary','valuation','buyback'].map(t => `<button onclick=\"updateState('activeTab', '${t}')\" class=\"flex-1 py-4 border-b-4 font-black transition-all ${activeTab === t ? 'border-[#005088] text-[#005088]' : 'border-transparent text-slate-400'} uppercase text-xs tracking-widest whitespace-nowrap flex items-center justify-center gap-2\"><i class=\"fas ${t === 'inputs' ? 'fa-edit' : t === 'contract' ? 'fa-file-signature' : t === 'summary' ? 'fa-list-check' : t === 'valuation' ? 'fa-scale-balanced' : 'fa-handshake'} text-lg\"></i>${t}</button>`).join('')}</div><div class=\"max-w-5xl mx-auto p-4 sm:p-6\">${tabContent}</div><dialog id=\"print-modal\" class=\"modal p-0 rounded-3xl shadow-2xl border-0 overflow-hidden\"><div class=\"bg-white p-10 w-80 relative text-center\"><button onclick=\"closeModal()\" class=\"absolute top-5 right-5 text-slate-300 hover:text-slate-600\"><i class=\"fas fa-times text-2xl\"></i></button><h3 class=\"font-black mb-8 uppercase text-xs tracking-widest border-b pb-4\">Generate Report</h3><div class=\"space-y-3\">
                <button onclick=\"handleGenerateReport('realtor')\" class=\"w-full text-left p-4 border-2 border-slate-50 rounded-2xl hover:bg-blue-50 transition-all font-black uppercase text-[10px] tracking-widest\">REALTOR ADVISORY REPORT</button>
            </div></div></dialog></div>`;
            if (activeModal) { const m = document.getElementById(activeModal); if (m && !m.open) m.showModal(); }
        };

        document.addEventListener('DOMContentLoaded', () => { window.calculate(); window.render(); });
    </script>
</body>
</html>
